<style>
/* Black Knight Glass: black ground, knight emblem watermark, warm-gold frosted cards, Cinzel crest type */
:root{
  --bg:#050505; --fg:#f4efe4; --muted:rgba(244,239,228,.66); --dim:rgba(244,239,228,.5);
  --gold:#d9b46c; --gold-hi:#f2d9a0; --gold-lo:#a9823f; --gold-bg:rgba(var(--gd),.16); --gold-line:rgba(var(--gd),.5);
  --metal:linear-gradient(135deg,#f2d9a0 0%,#d9b46c 45%,#a9823f 100%);
  --glass:rgba(var(--gd),.05); --glass-2:rgba(var(--gd),.09); --line:rgba(var(--gd),.16); --line-2:rgba(var(--gd),.28);
  --crest:"Cinzel","Trajan Pro",Georgia,serif;
  --blue:#b9c6ff; --blue-bg:rgba(var(--bl),.2); --green:#a6ecbc; --green-bg:rgba(var(--gn),.18); --red:#ffb4a8;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wh:255,255,255; --gd:217,180,108; --gh:242,217,160; --gl:169,130,63; --gn:130,220,160; --bl:140,165,255; --rd:255,180,168; --fgc:245,243,238; --sv:214,219,227;
  --metal-text:var(--metal); --silver:#d6dbe3; --sheet:rgba(18,15,10,.94); --nav:rgba(12,10,6,.72); --scrim:rgba(5,6,12,.55); --emblem:.07;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f1e5; --fg:#1d1810; --muted:rgba(29,24,16,.7); --dim:rgba(29,24,16,.55);
  --wh:29,24,16; --gd:138,100,32; --gh:196,150,60; --gl:138,100,32; --gn:30,120,70; --bl:50,80,200; --rd:190,50,35; --fgc:29,24,16; --sv:91,100,114;
  --gold:#8a6420; --gold-hi:#6e4d12; --gold-lo:#a9823f; --gold-line:rgba(138,100,32,.5);
  --metal:linear-gradient(135deg,#f0d68f 0%,#d9b46c 50%,#bf9446 100%); --metal-text:linear-gradient(135deg,#a9823f 0%,#8a6420 55%,#6e4d12 100%);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.85); --line:rgba(138,100,32,.22); --line-2:rgba(138,100,32,.38);
  --blue:#3550c8; --green:#1f7a46; --red:#b3392a; --silver:#566070;
  --sheet:rgba(250,246,236,.97); --nav:rgba(250,246,236,.82); --scrim:rgba(40,30,10,.42); --emblem:.09;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:500 15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bgmark{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgmark::before{content:"";position:absolute;left:50%;top:-180px;width:560px;height:420px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(var(--gd),.22),rgba(var(--gd),0));}
.bgmark img{position:absolute;left:50%;top:52%;width:min(118vw,560px);transform:translate(-50%,-50%);opacity:var(--emblem);filter:saturate(.9)}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.head{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold-line);box-shadow:0 0 0 3px rgba(var(--gd),.08);flex:none;object-fit:cover;background:#000}
.head .grow{flex:1;min-width:0}
.head .sp{font-family:var(--crest);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.head .uni{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:1px}
.head .team{font-family:var(--crest);font-weight:700;font-size:17px;letter-spacing:.04em;background:var(--metal-text);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.pagetitle{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pagetitle h1{margin:0;font-family:var(--crest);font-weight:700;font-size:26px;letter-spacing:.02em;color:var(--fg);text-wrap:balance}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-line))}
.rule::after{background:linear-gradient(90deg,var(--gold-line),transparent)}
.rule i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;flex:none}
.stat{padding:16px;display:flex;flex-direction:column;gap:12px}
.stat .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--crest);font-size:42px;font-weight:700;line-height:1;background:var(--metal-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:rgba(var(--wh),.12);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--metal);transition:width .4s}
.cta{height:52px;border-radius:18px;border:1px solid var(--gold-line);background:linear-gradient(135deg,rgba(var(--gh),.22),rgba(var(--gl),.18));color:var(--gold-hi);letter-spacing:.02em;font-weight:700;font-size:16px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.seg{display:flex;padding:4px;border-radius:16px;background:rgba(var(--wh),.06);border:1px solid rgba(var(--wh),.12)}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-bg);color:var(--gold-hi)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;padding:12px;text-align:left;width:100%}
.vote{width:50px;min-height:56px;border-radius:16px;border:1px solid rgba(var(--wh),.2);background:rgba(var(--wh),.08);font-weight:700;font-size:15px;line-height:1.15;flex:none;font-variant-numeric:tabular-nums}
.vote[aria-pressed="true"]{border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold)}
.card .body{flex:1;min-width:0}
.card h3{margin:6px 0 0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--dim);margin-top:3px}
.card .more{font-size:14px;color:var(--muted);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.s-yangi{background:rgba(var(--wh),.12);color:var(--muted)}
.s-qabul{background:var(--blue-bg);color:var(--blue)}
.s-jarayonda{background:var(--gold-bg);color:var(--gold)}
.s-hal{background:var(--green-bg);color:var(--green)}
.cat{font-size:11px;color:var(--dim);margin-left:6px}
.kn{color:var(--gold);font-size:13px}
.knpill{background:var(--metal);color:#1a1406}
.ladder{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.ladder i{flex:1;height:1px;background:var(--line-2)}
.ladder span.on{color:var(--gold-hi);font-weight:700}
.pg-mark{text-align:center;font-size:40px;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}.pg-name{text-align:center;font-family:Cinzel,serif;font-weight:700;font-size:20px;color:var(--gold-hi)}
.why{display:flex;flex-direction:column;gap:12px}.why .w{display:flex;gap:12px;align-items:flex-start}.why .w>b{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--metal);color:#1a1406;font-size:15px}.why h3{margin:2px 0 4px;font-size:16px;color:var(--gold-hi)}.why p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}
.kn.ld,.ldname{color:var(--silver)}.ldpill{background:linear-gradient(135deg,#eef1f5,#b9c0ca);color:#15181c}.card.elon.ld{border-color:rgba(var(--sv),.45);background:linear-gradient(135deg,rgba(var(--sv),.08),rgba(140,148,160,.04))}
.svlist{display:flex;flex-direction:column;gap:6px;margin-top:4px}.sv{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(var(--gd),.14)}.sv b{color:var(--gold-hi);min-width:38px;font-variant-numeric:tabular-nums}.sv span{flex:1;font-size:13px;line-height:1.35}.sv small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.reflink{font-size:13px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);color:var(--gold-hi);overflow-wrap:anywhere;user-select:all}
.dot{position:absolute;top:6px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.search{display:flex}
.search input{width:100%;min-height:48px;padding:12px 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--glass);font-size:16px;color:var(--fg)}
.search input:focus{outline:none;border-color:var(--gold-line)}
.person{display:flex;gap:12px;align-items:center;padding:12px;width:100%;text-align:left}
.pava{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;background:var(--gold-bg);border:1px solid var(--gold-line);display:grid;place-items:center;font-family:var(--crest);font-weight:700;font-size:20px;color:var(--gold-hi);overflow:hidden}
.pava img{width:100%;height:100%;object-fit:cover}
.person .body{flex:1;min-width:0}
.person b{display:block;font-size:15px;overflow-wrap:anywhere}
.person .meta{font-size:12px;color:var(--dim);margin-top:2px}
.person .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--green-bg);color:var(--green)}
.tag.l{background:var(--blue-bg);color:var(--blue)}
.psheet{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.psheet .pava{width:84px;height:84px;font-size:34px}
.req{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid rgba(var(--gd),.12)}
.req:first-of-type{border-top:0}
.req .row{display:flex;gap:10px;align-items:center}
.req .acts{display:flex;gap:8px}
.req .acts button{flex:1}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted)}
.linkname{background:none;border:0;padding:0;color:var(--fg);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:3px}
.kinds{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.kinds::-webkit-scrollbar{display:none}
.kinds .chip{flex:none;font-weight:600;color:var(--muted)}
.kinds .chip[aria-pressed="true"]{color:var(--gold-hi)}
.k-savol{background:var(--blue-bg);color:var(--blue)}
.k-kerak{background:var(--green-bg);color:var(--green)}
.k-elon{background:var(--metal);color:#1a1406}
.card.elon{border-color:var(--gold-line);background:linear-gradient(135deg,rgba(var(--gh),.1),rgba(var(--gl),.05))}
.admin{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin button{font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2)}
.admin button.on{border-color:var(--gold-line);color:var(--gold)}
.admin button.del{color:var(--red)}
.admin-rm{margin-left:6px;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--glass-2);color:var(--red)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.hero{padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--glass-2);border-color:var(--line-2);border-radius:26px}
.hero h2{margin:0;font-family:var(--crest);font-size:22px;font-weight:700;line-height:1.2;text-wrap:balance}
.hero p{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.hero .foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--gold-line);background:var(--gold-bg);font-weight:700;font-size:14px;color:var(--fg)}
.btn.done{border-color:rgba(var(--gn),.45);background:var(--green-bg);color:var(--green)}
.btn:disabled{opacity:.5}
.label{font-size:14px;font-weight:700;color:var(--muted);padding-top:4px}
.ev{display:flex;gap:12px;align-items:center;padding:12px}
.date{width:54px;height:58px;border-radius:16px;background:rgba(var(--wh),.1);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date b{font-size:20px;font-weight:800;line-height:1}
.date span{font-size:11px;color:var(--muted)}
.ev .body{flex:1;min-width:0}
.ev h3{margin:0;font-size:15px;font-weight:700}
.join{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:rgba(var(--wh),.08);font-weight:700;font-size:18px;flex:none}
.join[aria-pressed="true"]{border-color:rgba(var(--gn),.45);background:var(--green-bg);color:var(--green)}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border-radius:26px}
.ava{width:76px;height:76px;border-radius:50%;background:var(--gold-bg);border:1px solid var(--gold-line);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--gold)}
.prof h2{margin:0;font-family:var(--crest);font-size:21px;font-weight:700}
.nums{display:flex;gap:28px;margin-top:6px;text-align:center}
.nums b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--muted)}
.box{padding:16px;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-family:var(--crest);font-size:16px;font-weight:700;color:var(--gold-hi)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}
button.chip[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold);font-weight:700}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swap div{padding:12px;border-radius:16px;min-width:0}
.swap .t{background:rgba(var(--gn),.12);border:1px solid rgba(var(--gn),.3)}
.swap .l{background:rgba(var(--bl),.12);border:1px solid rgba(var(--bl),.3)}
.swap small{font-size:12px}.swap .t small{color:var(--green)}.swap .l small{color:var(--blue)}
.swap b{display:block;font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.match{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid rgba(var(--wh),.08);font-size:14px}
.match span{color:var(--muted);text-align:right}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px;align-self:center}
nav{border-color:var(--line-2)!important;background:var(--nav)!important;position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));height:64px;border-radius:26px;background:rgba(var(--wh),.1);border:1px solid rgba(var(--wh),.2);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:space-around;padding:0 8px}
nav button{position:relative;border:0;background:none;padding:10px 8px;border-radius:16px;font-weight:600;font-size:12.5px;color:var(--muted)}
/* market */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;width:100%;min-width:0;border-radius:20px}
.mcard .ph{position:relative;aspect-ratio:1/1;background:rgba(var(--wh),.05);overflow:hidden}
.mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .ph .sold{position:absolute;left:8px;top:8px}
.mcard .ph .wn{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(5,5,5,.7);color:var(--gold-hi)}
.mcard .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard .pr{font-weight:800;font-size:15px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.mcard .tt{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mcard .mt{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.off{opacity:.6}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;max-height:60vh;aspect-ratio:1/1;object-fit:cover;border-radius:20px;scroll-snap-align:center;background:rgba(var(--wh),.05)}
.gallery.multi img{width:88%}
.lprice{font-family:var(--crest);font-weight:700;font-size:26px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.seller{display:flex;gap:12px;align-items:center;padding:12px}
.seller .body{flex:1;min-width:0}
.pickers{display:flex;gap:8px;flex-wrap:wrap}
.pick{position:relative;width:84px;height:84px;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);background:rgba(var(--wh),.06)}
.pick img{width:100%;height:100%;object-fit:cover}
.pick button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(5,5,5,.75);color:#fff;font-size:12px;line-height:1}
.pick.add{display:grid;place-items:center;border-style:dashed;color:var(--gold-hi);font-size:26px;cursor:pointer}
.rules{font-size:12px;color:var(--dim);line-height:1.45;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
nav button[aria-current="page"]{background:var(--gold-bg);color:var(--gold)}
/* bottom sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;background:var(--sheet);border-top:1px solid var(--line-2);-webkit-backdrop-filter:blur(36px);backdrop-filter:blur(36px);
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar>i{transition:none}}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(var(--wh),.3)}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-family:var(--crest);font-size:22px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:rgba(var(--fgc),.8)}
.field input,.field textarea,.field select{min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid rgba(var(--wh),.18);background:rgba(var(--wh),.08);font-size:16px;font-weight:500;color:var(--fg);resize:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--gold-line);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:rgba(var(--wh),.06);border:1px solid var(--line);width:100%;text-align:left}
.toggle .sw{width:48px;height:28px;border-radius:14px;background:rgba(var(--wh),.2);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:left .15s}
.toggle[aria-checked="true"] .sw{background:var(--metal)}
.toggle[aria-checked="true"] .sw::after{left:23px;background:var(--bg)}
.primary{height:54px;border-radius:18px;border:0;background:var(--metal);color:#1a1406;font-weight:800;font-size:16px}
.primary:disabled{opacity:.55}
.err{color:var(--red);font-size:13px;min-height:1em}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));padding:10px 16px;border-radius:14px;background:var(--sheet);border:1px solid var(--line-2);font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.skeleton{height:80px;border-radius:22px;background:rgba(var(--wh),.05)}
.offline{padding:12px 14px;border-radius:16px;background:rgba(var(--rd),.12);border:1px solid rgba(var(--rd),.35);color:var(--red);font-size:13px}
</style>
</head>
<body>
<div class="bgmark" aria-hidden="true"><img src="emblem.webp" alt=""></div>
<main class="app" id="app"></main>
<nav aria-label="Bo‘limlar">
  <button data-tab="ovoz" aria-current="page">Lenta</button>
  <button data-tab="odamlar">Odamlar</button>
  <button data-tab="tadbirlar">Tadbirlar</button>
  <button data-tab="market">Market</button>
  <button data-tab="profil">Profil<span class="dot" id="reqdot" hidden></span></button>
</nav>
<div id="layer"></div>
<script>
(() => {
'use strict';
const API = 'https://br-steep-haze-b9tabbet-api.compute.c-7.eu-central-1.aws.neon.tech';
const CATS = ["O'quv jarayoni", 'Ustozlar bilan', 'Infratuzilma', 'Yotoqxona', 'Boshqa'];
const STATUS = { yangi: 'Yangi', qabul: 'Qabul qilindi', jarayonda: 'Jarayonda', hal: 'Hal qilindi' };
const KINDS = {
  muammo: { label: 'Muammo', many: 'Muammolar', ph: 'Masalan: Wi-Fi 3-qavatda ishlamaydi', bph: 'Qayerda, qachondan beri, kimga ta’sir qilyapti?', ok: 'Murojaat yuborildi' },
  savol: { label: 'Savol', many: 'Savollar', ph: 'Masalan: Amaliy matematikadan 11-variantni kim yechdi?', bph: 'Savolingizni batafsilroq yozing', ok: 'Savol joylandi' },
  kerak: { label: 'Kerak', many: 'Kerak', ph: 'Masalan: Menga Figma o‘rgatadigan odam kerak', bph: 'Nima kerak, qachon, evaziga nima bera olasiz?', ok: 'Post joylandi' },
  elon: { label: 'E’lon', many: 'E’lonlar', ph: 'Masalan: Shanba kuni ochiq uchrashuv', bph: 'E’lon matni', ok: 'E’lon joylandi' },
};
const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
const THEME_BG = { dark: '#050505', light: '#f6f1e5' };
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', THEME_BG[t]);
  if (TG) { try { TG.setHeaderColor && TG.setHeaderColor(THEME_BG[t]); TG.setBackgroundColor && TG.setBackgroundColor(THEME_BG[t]); } catch (e) {} }
}
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('bk_theme', t); } catch (e) {}
  applyTheme(t);
  document.querySelectorAll('.themebtn').forEach(b => { b.textContent = t === 'light' ? '☾' : '☀'; b.setAttribute('aria-label', t === 'light' ? 'Kechki rejim' : 'Kunduzgi rejim'); });
}
let _th = 'dark'; try { _th = localStorage.getItem('bk_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
applyTheme(_th);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const TG_INIT = TG && TG.initData ? TG.initData : '';
const TG_USER = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
let uid = TG_USER && TG_INIT ? 'tg' + TG_USER.id : store.get('bk_uid');
if (!uid) { uid = 'u' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Math.random().toString(36).slice(2) + Date.now().toString(36)); store.set('bk_uid', uid); }
let adminKey = store.get('bk_admin') || '';
let isAdmin = false;

const S = { tab: 'ovoz', ptab: 'top', kind: '', problems: null, events: null, stats: null, me: null, myStats: null, matches: [], open: {}, offline: false };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, el = document) => el.querySelector(sel);

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json' };
  if (adminKey) headers['x-admin-key'] = adminKey;
  if (TG_INIT) headers['x-tg-init'] = TG_INIT;
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || 'Xatolik yuz berdi'); err.status = res.status; throw err; }
  return data;
}

function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return 'hozir';
  if (s < 3600) return Math.floor(s / 60) + ' daqiqa oldin';
  if (s < 86400) return Math.floor(s / 3600) + ' soat oldin';
  if (s < 7 * 86400) return Math.floor(s / 86400) + ' kun oldin';
  return d.getDate() + '-' + MONTHS[d.getMonth()];
}
const hhmm = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function until(iso) {
  const days = Math.round((new Date(iso).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 864e5);
  if (days <= 0) return 'Bugun';
  if (days === 1) return 'Ertaga';
  return days + ' kundan keyin';
}

let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

const head = (title, extra = '') => `<header class="head"><img class="logo" src="logo.jpg" alt="Black Knight Team logotipi"><div class="grow"><div class="team">Black Knight Team</div><div class="uni">Millat Umidi University</div></div><button class="iconbtn themebtn" data-act="theme" aria-label="${document.documentElement.getAttribute('data-theme') === 'light' ? 'Kechki rejim' : 'Kunduzgi rejim'}" style="font-size:17px">${document.documentElement.getAttribute('data-theme') === 'light' ? '☾' : '☀'}</button>${extra}</header>
  <div class="pagetitle"><h1>${title}</h1><div class="rule" aria-hidden="true"><i></i></div></div>`;

// ---------- data
async function loadStats() { try { S.stats = await api('/api/stats'); S.offline = false; } catch (e) { S.offline = true; } }
async function loadProblems() {
  try { S.problems = (await api(`/api/problems?tab=${S.ptab}&kind=${S.kind}&uid=${uid}`)).problems; S.offline = false; }
  catch (e) { S.offline = true; if (!S.problems) S.problems = []; }
}
async function loadEvents() {
  try { S.events = (await api(`/api/events?uid=${uid}`)).events; S.offline = false; }
  catch (e) { S.offline = true; if (!S.events) S.events = []; }
}
async function loadMe() {
  try { const r = await api(`/api/me?uid=${uid}`); S.me = r.user; S.myStats = r.stats || null; S.score = r.score || null; S.knights = r.knights || 0; S.knightLimit = r.knight_limit || 229; S.refLink = r.ref_link || null; S.service = r.service || null; S.team = !!r.team; S.leader = !!r.leader;
    S.svc = r.user && (r.user.role === 'volunteer' || (r.service && r.service.entries)) ? await api(`/api/service/${encodeURIComponent(uid)}`) : null; } catch (e) {}
}
S.people = null; S.pq = ''; S.requests = [];
async function loadPeople() { try { S.people = (await api(`/api/people?q=${encodeURIComponent(S.pq)}&uid=${uid}`)).people; S.offline = false; } catch (e) { S.offline = true; if (!S.people) S.people = []; } }
async function loadRequests() {
  try { S.requests = (await api(`/api/requests?uid=${uid}`)).incoming; } catch (e) { S.requests = []; }
  const dot = document.getElementById('reqdot'); if (dot) dot.hidden = !S.requests.length;
}
const avatar = (p) => `<span class="pava" aria-hidden="true">${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${p.photo_url ? '' : esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>`;
S.contacts = [];
async function loadContacts() { try { S.contacts = (await api(`/api/contacts?uid=${uid}`)).contacts || []; } catch (e) { S.contacts = []; } }
async function loadMatches() { try { S.matches = (await api(`/api/matches?uid=${uid}`)).matches; } catch (e) { S.matches = []; } }
async function checkAdmin() {
  if (!TG_INIT && !adminKey) { isAdmin = false; return; }
  try { isAdmin = (await api('/api/admin/check')).admin; } catch (e) { isAdmin = false; }
  if (!isAdmin && adminKey) { adminKey = ''; store.del('bk_admin'); }

}
S.admins = []; S.vols = [];
// Status marks next to a name: founder, team, volunteer, first-229 knight.
const marks = (o) => (o.title === 'Founder' ? ' <span class="kn" title="Founder">✦</span>' : '') + (o.team ? ' <span class="kn" title="Jamoa">◆</span>' : '') + (o.role === 'volunteer' ? ' <span class="kn" title="Volontyor">✧</span>' : '') + (o.role === 'leader' ? ` <span class="kn ld" title="${esc(o.position || 'Yetakchi')}">◇</span>` : '') + (o.knight_no ? ` <span class="kn" title="Birinchi ritsar #${o.knight_no}">♞</span>` : '');
const VLADDER = [['Volontyor', 0], ['Yordamchi', 10], ['Fidoyi', 25], ['Xizmat ustasi', 50]];
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getDate()}-${MONTHS[d.getMonth()]}`; };
function serviceBox(sum, entries, canEdit, title) {
  if (!sum) return '';
  const i = VLADDER.findIndex((l) => l[0] === sum.level);
  const prev = VLADDER[i] ? VLADDER[i][1] : 0;
  const pct = sum.next_at ? Math.round((sum.hours - prev) / (sum.next_at - prev) * 100) : 100;
  return `<section class="glass box" aria-label="Xizmat daftari">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3>${title || 'Xizmat daftari'}</h3><span class="small" style="font-variant-numeric:tabular-nums">${sum.hours} soat</span></div>
    <div style="font-weight:600;color:var(--gold-hi)">✧ ${esc(sum.level)}</div>
    <div class="bar" role="img" aria-label="${pct}%"><i style="width:${pct}%"></i></div>
    <div class="small">${sum.next_level ? `«${esc(sum.next_level)}» darajasigacha ${Math.round((sum.next_at - sum.hours) * 10) / 10} soat qoldi` : 'Eng yuqori daraja — Xizmat ustasi'}</div>
    <div class="ladder">${VLADDER.slice(1).map((l, k) => `${k ? '<i></i>' : ''}<span${sum.hours >= l[1] ? ' class="on"' : ''}>${l[0]} · ${l[1]}</span>`).join('')}</div>
    <div class="small">${sum.entries} ta xizmat · ${sum.events} ta tadbirda</div>
    ${(entries || []).length ? `<div class="svlist">${entries.map((e) => `<div class="sv"><b>+${e.hours}</b><span>${esc(e.note)}${e.event_title ? ' · ' + esc(e.event_title) : ''}<small>${fmtDate(e.created_at)}</small></span>${canEdit ? `<button class="admin-rm" data-delsv="${e.id}" aria-label="Yozuvni o‘chirish">×</button>` : ''}</div>`).join('')}</div>` : ''}
  </section>`;
}
async function loadAdmins() { try { S.admins = (await api('/api/admins')).admins; S.vols = (await api('/api/volunteers')).volunteers; if (S.tab === 'profil' && !document.querySelector('.scrim')) render(); } catch (e) {} }

// ---------- views
function offlineNote() { return S.offline ? '<div class="offline" role="alert">Server bilan aloqa yo‘q. Internetni tekshirib, sahifani yangilang.</div>' : ''; }

function viewOvoz() {
  const st = S.stats || { total: 0, progress: 0, done: 0, done_month: 0 };
  const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
  const showIssues = S.kind === '' || S.kind === 'muammo';
  const tabs = [['top', 'Dolzarb'], ['new', 'Yangi']].concat(showIssues ? [['done', 'Hal qilingan']] : []);
  const kinds = [['', 'Hammasi']].concat(Object.keys(KINDS).map((k) => [k, KINDS[k].many]));
  let list;
  if (S.problems === null) list = '<div class="skeleton"></div><div class="skeleton"></div>';
  else if (!S.problems.length) list = `<div class="glass empty"><b>${S.ptab === 'done' ? 'Hali hal qilingan muammo yo‘q' : 'Bu yerda hali post yo‘q'}</b>Birinchi bo‘lib yozing: “+ Post yozish” tugmasini bosing.</div>`;
  else list = S.problems.map(problemCard).join('');
  return head('Talabalar lentasi', '<button class="iconbtn" data-act="welcome" aria-label="Black Knight nima?" style="font-family:var(--crest);font-weight:700;font-size:18px">?</button>') + offlineNote() + `
  ${showIssues ? `<section class="glass stat" aria-label="Murojaatlar statistikasi">
    <div class="row"><div><div class="small">Shu oy hal qilingan muammolar</div><div class="big">${st.done_month}</div></div>
    <div class="small" style="text-align:right">${st.total} murojaat<br>${st.progress} tasi jarayonda</div></div>
    <div class="bar" role="img" aria-label="${pct}% hal qilingan"><i style="width:${pct}%"></i></div>
  </section>` : ''}
  <button class="cta" data-act="new">+ Post yozish</button>
  <div class="kinds" role="group" aria-label="Post turi">${kinds.map(([k, l]) => `<button class="chip" data-kind="${k}" aria-pressed="${S.kind === k}">${l}</button>`).join('')}</div>
  <div class="seg" role="group" aria-label="Saralash">${tabs.map(([k, l]) => `<button data-ptab="${k}" aria-pressed="${S.ptab === k}">${l}</button>`).join('')}</div>
  <div class="list">${list}</div>`;
}

function problemCard(p) {
  const open = S.open[p.id];
  const kind = KINDS[p.kind] ? p.kind : 'muammo';
  const leaderPost = kind === 'elon' && p.author_role === 'leader';
  const who = leaderPost ? `<span class="ldname">◇ ${esc(p.author_position || p.author || 'Yetakchi')}</span>` : kind === 'elon' ? 'Black Knight Team' : p.anon ? 'Anonim' : esc(p.author || 'Talaba') + marks({ title: p.author_title, team: p.author_team, role: p.author_role, position: p.author_position, knight_no: p.author_knight });
  const badge = kind === 'muammo'
    ? `<span class="pill s-${p.status}">${STATUS[p.status]}</span><span class="cat">${esc(p.category)}</span>`
    : `<span class="pill ${leaderPost ? 'ldpill' : 'k-' + kind}">${KINDS[kind].label}</span>`;
  const statusBtns = kind === 'muammo' ? Object.keys(STATUS).map((k) => `<button data-status="${k}" data-id="${p.id}" class="${p.status === k ? 'on' : ''}">${STATUS[k]}</button>`).join('') : '';
  const adminRow = (S.leader && p.mine && kind === 'elon') ? `<div class="admin"><button class="del" data-delp="${p.id}">O‘chirish</button></div>` : '';
  return `<article class="glass card${kind === 'elon' ? (leaderPost ? ' elon ld' : ' elon') : ''}">
    <button class="vote" data-vote="${p.id}" aria-pressed="${p.voted}" aria-label="Ovoz berish, ${p.votes} ovoz">▲<br>${p.votes}</button>
    <div class="body">
      ${badge}
      <h3>${esc(p.title)}</h3>
      <div class="meta">${who} · ${ago(p.created_at)}${p.body ? ` · <button class="link" style="padding:0;font-size:12px" data-open="${p.id}" aria-expanded="${!!open}">${open ? 'Yopish' : 'Batafsil'}</button>` : ''}</div>
      ${open && p.body ? `<div class="more">${esc(p.body)}</div>` : ''}
      ${adminRow}
    </div>
  </article>`;
}

function viewTadbirlar() {
  const evs = S.events;
  const addBtn = S.leader ? '<button class="iconbtn" data-act="newevent" aria-label="Tadbir qo‘shish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>' : '';
  let body;
  if (evs === null) body = '<div class="skeleton" style="height:200px"></div>';
  else if (!evs.length) body = `<div class="glass empty"><b>Yaqin kunlarda tadbir yo‘q</b>Yangi tadbirlar e’lon qilinganda shu yerda chiqadi.</div>`;
  else {
    const [first, ...rest] = evs;
    const d = new Date(first.starts_at);
    const cap = first.capacity;
    const full = cap && first.going >= cap && !first.joined;
    body = `<section class="glass hero">
      <span class="pill s-jarayonda" style="align-self:flex-start">${until(first.starts_at)}</span>
      <h2>${esc(first.title)}</h2>
      ${first.description ? `<p>${esc(first.description)}</p>` : ''}
      <div class="small">${d.getDate()}-${MONTHS[d.getMonth()]}${first.date_only ? '' : ', ' + hhmm(d)}${first.place ? ' · ' + esc(first.place) : ''}</div>
      ${first.organizer ? `<div class="small">Tashkil etuvchi: <span class="ldname">◇ ${esc(first.organizer.position || first.organizer.name)}</span></div>` : ''}
      ${cap ? `<div class="bar"><i style="width:${Math.min(100, Math.round(first.going / cap * 100))}%"></i></div>` : ''}
      <div class="foot"><span class="small">${cap ? `${first.going} / ${cap} joy band` : `${first.going} kishi qatnashadi`}</span>
      <button class="btn ${first.joined ? 'done' : ''}" data-rsvp="${first.id}" ${full ? 'disabled' : ''}>${first.joined ? '✓ Yozildingiz' : full ? 'Joy qolmadi' : 'Qatnashaman'}</button></div>
      ${first.joined && first.link ? `<button class="btn" data-glink="${esc(first.link)}" style="width:100%">👥 Tadbir guruhiga qo‘shilish</button>` : ''}
      ${S.leader && first.mine ? `<div class="admin"><button class="del" data-att="${first.id}" style="color:inherit">Ishtirokchilar (${first.going})</button><button class="del" data-dele="${first.id}">O‘chirish</button></div>` : ''}
    </section>
    ${rest.length ? '<div class="label">Keyingi tadbirlar</div>' : ''}
    <div class="list">${rest.map((e) => {
      const dd = new Date(e.starts_at);
      return `<article class="glass ev"><div class="date"><b>${dd.getDate()}</b><span>${MONTHS[dd.getMonth()]}</span></div>
        <div class="body"><h3>${esc(e.title)}</h3><div class="meta small" style="font-size:12px">${e.date_only ? dd.getDate() + '-' + MONTHS[dd.getMonth()] : hhmm(dd)}${e.place ? ' · ' + esc(e.place) : ''} · ${e.capacity ? e.going + '/' + e.capacity : e.going + ' kishi'}${e.organizer ? ` · <span class="ldname">◇ ${esc(e.organizer.position || e.organizer.name)}</span>` : ''}</div>
        ${S.leader && e.mine ? `<div class="admin"><button class="del" data-att="${e.id}" style="color:inherit">Ishtirokchilar</button><button class="del" data-dele="${e.id}">O‘chirish</button></div>` : ''}</div>
        <button class="join" data-rsvp="${e.id}" aria-pressed="${e.joined}" aria-label="${e.joined ? 'Yozilishni bekor qilish' : 'Qatnashish'}">${e.joined ? '✓' : '+'}</button></article>`;
    }).join('')}</div>`;
  }
  return head('Tadbirlar', addBtn) + offlineNote() + body;
}

// ---------- market
const MCATS = ['Kitoblar', 'Texnika', 'Kiyim', 'Kanselyariya', 'Yotoqxona', 'Sport', 'Boshqa'];
const MCOND = { yangi: 'Yangi', yaxshi: 'Yaxshi', ortacha: 'O‘rtacha' };
const price = (p) => (p === null || p === undefined ? 'Kelishiladi' : +p === 0 ? 'Bepul' : Number(p).toLocaleString('ru-RU').replace(/ /g, ' ') + ' so‘m');
const imgUrl = (id) => `${API}/api/market/img/${id}`;
const profileOk = (me) => !!(me && me.major && me.major.trim() && ((me.interests || []).length || (me.teach || '').trim() || (me.learn || '').trim()));
S.market = null; S.mcat = ''; S.mq = ''; S.mmine = false; S.mhidden = false;
const MREASONS = ['Taqiqlangan buyum', 'Firibgarlik', 'Noto‘g‘ri ma’lumot', 'Haqoratli', 'Boshqa'];
async function loadMarket() {
  try { S.market = (await api(`/api/market?cat=${encodeURIComponent(S.mcat)}&q=${encodeURIComponent(S.mq)}&uid=${uid}${S.mmine ? '&mine=1' : ''}${S.mhidden ? '&hidden=1' : ''}`)).listings; S.offline = false; }
  catch (e) { S.marketSoon = e.status === 404; S.offline = !S.marketSoon; if (!S.market) S.market = []; }
}
// Buying and selling need a filled profile; otherwise send the person to fill it first.
function needFullProfile(action, why) {
  if (profileOk(S.me)) return true;
  toast(why); pendingAction = action; profileSheet(!S.me); return false;
}
function marketList() {
  if (S.market === null) return '<div class="mgrid"><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div></div>';
  if (S.marketSoon) return '<div class="glass empty"><b>Market tez orada ochiladi</b>Bo‘lim tayyorlanmoqda — bir oz kuting.</div>';

// Shrinks a photo on the phone before upload: longest side ≤ 1080px, JPEG.
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let out = '';
      for (const [max, qlt] of [[1080, 0.78], [900, 0.66], [720, 0.58]]) {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', qlt);
        if (out.length < 600000) break;
      }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Rasmni ochib bo‘lmadi')); };
    img.src = url;
  });
}

  sh.innerHTML = sheetTop('Talaba') + `

      <div class="small">${esc([p.major, p.year && p.year + '-kurs'].filter(Boolean).join(' · ') || 'Millat Umidi talabasi')}</div>

      catch (x) { $('#ps-err', sh).textContent = x.message; }
    };
    ldf.addEventListener('submit', (e) => { e.preventDefault(); const n = $('#ld-name', sh).value.trim(); if (!n) { $('#ps-err', sh).textContent = 'Nomini yozing'; return; } saveLd(n); });
    const off = $('[data-ldoff]', ldf); if (off) off.addEventListener('click', () => saveLd(''));
  }
  const pgf = $('#pgform', sh);
  if (pgf) pgf.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', pgf); btn.disabled = true;
    try { await api(`/api/people/${encodeURIComponent(p.id)}/position`, { method: 'POST', body: { position: $('#pg-pos', sh).value } }); toast('Saqlandi'); personSheet(id); }
    catch (x) { $('#ps-err', sh).textContent = x.message; btn.disabled = false; }
  });
  const svf = $('#svform', sh);
  if (svf) svf.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', svf); btn.disabled = true;
    try {
      await api('/api/service', { method: 'POST', body: { user_id: p.id, hours: $('#sv-h', sh).value, note: $('#sv-n', sh).value, event_id: ($('#sv-e', sh) || {}).value || null } });
      toast('Xizmat daftariga yozildi'); loadAdmins(); personSheet(id);
    } catch (x) { $('#ps-err', sh).textContent = x.message; btn.disabled = false; }
  });
  sh.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const err = $('#ps-err', sh);
    if (b.dataset.request) {
      b.disabled = true;
      try { await api('/api/requests', { method: 'POST', body: { uid, to: b.dataset.request, note: ($('#rq-note', sh) || {}).value || '' } }); toast('So‘rov yuborildi'); personSheet(b.dataset.request); }
      catch (x) { err.textContent = x.message; b.disabled = false; }

      openDm(b.dataset.write, b.dataset.user);

      catch (x) { err.textContent = x.message; b.disabled = false; }
    } else if (b.dataset.role !== undefined) {
      b.disabled = true;
      try { await api(`/api/people/${encodeURIComponent(p.id)}/role`, { method: 'POST', body: { role: b.dataset.role || null } }); toast(b.dataset.role ? 'Volontyor qilindi' : 'Olib tashlandi'); loadAdmins(); personSheet(id); }
      catch (x) { err.textContent = x.message; b.disabled = false; }
    } else if (b.dataset.delsv) {
      b.disabled = true;
      try { await api(`/api/service/entry/${b.dataset.delsv}`, { method: 'DELETE' }); toast('Yozuv o‘chirildi'); loadAdmins(); personSheet(id); }
      catch (x) { err.textContent = x.message; b.disabled = false; }
    }
  });
}

function pagonBox() {

  return `<section class="glass box pagon" aria-label="Mas’uliyat">

}
function levelBox() {

    <div class="ladder"><span${sc.level_index >= 0 ? ' class="on"' : ''}>Navkar</span><i></i><span${sc.level_index >= 1 ? ' class="on"' : ''}>Ritsar · 100</span><i></i><span${sc.level_index >= 2 ? ' class="on"' : ''}>Qora ritsar · 300</span></div>

function inviteBox() {

function render() {
  const app = $('#app');

  app.innerHTML = S.tab === 'ovoz' ? viewOvoz() : S.tab === 'odamlar' ? viewOdamlar() : S.tab === 'tadbirlar' ? viewTadbirlar() : S.tab === 'market' ? viewMarket() : viewProfil();

// ---------- sheets
function openSheet(html, onMount) {
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $('.scrim', layer);
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) closeSheet(); });
  document.body.style.overflow = 'hidden';
  onMount && onMount($('.sheet', layer));
  const f = $('input,textarea', layer); f && setTimeout(() => f.focus(), 60);
}
async function attendeesSheet(id) {
  openSheet(sheetTop('Ishtirokchilar') + '<div id="att-body" class="small">Yuklanmoqda…</div>');
  let rows;
  try { rows = (await api(`/api/events/${id}/attendees`)).attendees; }
  catch (err) { const b = $('#att-body'); if (b) b.textContent = err.message; return; }
  const b = $('#att-body'); if (!b) return;
  const tsv = 'Ism\tUsername\tKontakt\tYo‘nalish\tKurs\tManba\n' + rows.map((r) => [r.name, r.username ? '@' + r.username : '', r.contact, r.major, r.year, r.src === 'bot' ? 'bot' : 'ilova']
    .map((v) => String(v == null ? '' : v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
  b.innerHTML = `<p style="margin:0 0 10px"><b>${rows.length}</b> kishi yozilgan</p>
    <div class="list">${rows.map((r, i) => `<div class="glass" style="padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center">
      <span>${i + 1}. ${esc(r.name || 'Nomaʼlum')}${r.major ? ` <span class="small">· ${esc(r.major)}${r.year ? ', ' + esc(r.year) : ''}</span>` : ''}</span>
      <span class="small">${r.username ? '@' + esc(r.username) : esc(r.contact || '')}</span></div>`).join('')}</div>
    ${rows.length ? '<button class="btn" id="att-copy" style="width:100%;margin-top:12px">Ro‘yxatni nusxalash (Excel uchun)</button>' : ''}
    ${false ? `<div class="label" style="margin-top:18px">Botda e’lon qilish</div>
      <button class="btn" id="ann-test" style="width:100%">1. O‘zimga sinov yuborish</button>
      <button class="btn" id="ann-all" style="width:100%;margin-top:8px">2. Barcha a’zolarga yuborish</button>
      <div class="small" id="ann-res" style="margin-top:8px">Avval sinovni ko‘ring. Hammaga yuborish har bir kishiga bir martadan boradi.</div>` : ''}`;
  const res = $('#ann-res');
  const at = $('#ann-test'), aa = $('#ann-all');
  if (at) at.addEventListener('click', async () => {
    at.disabled = true; res.textContent = 'Yuborilmoqda…';
    try { const r = await api(`/api/events/${id}/announce`, { method: 'POST', body: { to: 'me' } }); res.textContent = r.ok ? '✓ Sinov botga yuborildi — tekshirib ko‘ring.' : 'Xato: ' + (r.error || 'yuborilmadi'); }
    catch (err) { res.textContent = err.message; }
    at.disabled = false;
  });
  if (aa) aa.addEventListener('click', async () => {
    if (aa.dataset.confirm !== '1') { aa.dataset.confirm = '1'; aa.textContent = 'Rostdan hammaga yuborilsinmi? Yana bosing'; return; }
    aa.disabled = true; res.textContent = 'Yuborilmoqda… 1–2 daqiqa kuting, oynani yopmang.';
    try { const r = await api(`/api/events/${id}/announce`, { method: 'POST', body: { to: 'all' } }); res.textContent = `✓ Yuborildi: ${r.sent}, yetmadi: ${r.failed} (botni bloklaganlar).`; aa.textContent = 'Yuborildi'; }
    catch (err) { res.textContent = 'Uzilib qoldi — qayta bossangiz, qolganlarga davom etadi. (' + err.message + ')'; aa.disabled = false; aa.dataset.confirm = ''; aa.textContent = '2. Davom ettirish'; }
  });
  const c = $('#att-copy');
  if (c) c.addEventListener('click', async () => { try { await navigator.clipboard.writeText(tsv); toast('Nusxalandi — Excel’ga joylang'); } catch (e) { toast('Nusxalab bo‘lmadi'); } });
}

    $('#pf-major-sel', el).addEventListener('change', (e) => { const inp = $('#pf-major', el); inp.hidden = e.target.value !== 'Boshqa'; if (!inp.hidden) inp.focus(); });
    $('#pf-int', el).addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); });
    $('#pf', el).addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = $('#pf-name', el).value.trim();
      if (!name) { $('#pf-err', el).textContent = 'Ismingizni yozing.'; return; }
      const btn = $('button[type=submit]', el); btn.disabled = true;
      try {
        const msel = $('#pf-major-sel', el).value;
        const r = await api('/api/me', { method: 'PUT', body: { uid, name, major: msel === 'Boshqa' ? $('#pf-major', el).value : msel, year: $('#pf-year', el).value,
          interests: [...el.querySelectorAll('#pf-int [aria-pressed="true"]')].map((b) => b.textContent), teach: $('#pf-teach', el).value, learn: $('#pf-learn', el).value, contact: (el.querySelector('#pf-contact [aria-pressed="true"]') || {}).dataset?.c || 'request' } });
        S.me = r.user; closeSheet();
        toast(r.knight === 'awarded' ? `♞ Tabriklaymiz! Siz Birinchi ritsar #${r.user.knight_no}` : r.knight === 'not-subscribed' ? 'Saqlandi. Nishon uchun @blackknightsp kanaliga obuna bo‘ling' : r.knight === 'incomplete' ? 'Saqlandi. Nishon uchun yo‘nalish va qiziqishni ham kiriting' : 'Profil saqlandi'); await Promise.all([loadMe(), loadMatches()]); render();
        if (pendingAction) { const a = pendingAction; pendingAction = null; a(); }
      } catch (err) { $('#pf-err', el).textContent = err.message; btn.disabled = false; }
    });
  });
}

// Opens a chat: directly when the person has a @username, otherwise through the bot relay.
function openDm(id, user) {
  const link = user ? 'https://t.me/' + user : 'https://t.me/blackknightsp_bot?start=dm_' + String(id).replace(/^tg/, '');
  if (TG && TG.openTelegramLink) TG.openTelegramLink(link); else window.open(link, '_blank');
}
const MAJORS = ['ELT', 'Business Administration', 'IT', 'Finance'];
const profileEmpty = (me) => !me || !(me.major || me.teach || me.learn || (me.interests || []).length);
function welcomeSheet() {
  store.set('bk_welcome', '1');
  const left = Math.max(0, (S.knightLimit || 229) - (S.knights || 0));
  openSheet(sheetTop('Nega Black Knight?') + `
    <div class="small" style="font-size:15px;color:var(--fg)">Bu — Millat Umidi talabalarining o‘z platformasi. Bu yerda uch narsa bor:</div>
    <div class="why">
      <div class="w"><b>1</b><div><h3>Ovozingiz eshitiladi</h3><p>Kampusdagi muammoni yozing — xohlasangiz anonim. Ko‘p ovoz to‘plagan muammoni Black Knight jamoasi ma’muriyatga olib chiqadi. Holati o‘zgarsa, bot sizga xabar beradi.</p></div></div>
      <div class="w"><b>2</b><div><h3>Kerakli odamni topasiz</h3><p>Kim Python biladi, kim dizayn qiladi, kim ingliz tilida yordam beradi — «Odamlar»da qidiring. O‘zingiz nimani o‘rgata olishingizni yozsangiz, sizni ham topishadi.</p></div></div>
      <div class="w"><b>3</b><div><h3>Ritsarga aylanasiz</h3><p>Har bir post, ovoz va taklif qilgan do‘stingiz uchun ball: Navkar → Ritsar → Qora ritsar.${left ? ` Profilini to‘ldirgan va kanalga obuna bo‘lganlarga — «Birinchi ritsar» nishoni, ${left} ta joy qoldi.` : ''}</p></div></div>
    </div>
    <div class="label" style="margin:4px 0 0">Boshlash — 1 daqiqa</div>
    <ol class="steps"><li>Profilingizni to‘ldiring: yo‘nalish, qiziqishlar, nimani o‘rgatasiz</li><li>Lentadagi muammolarga ovoz bering yoki o‘zingiznikini yozing</li></ol>
    ${profileEmpty(S.me) ? '<button class="primary" data-act="welcome-profile">Profilni to‘ldirish</button>' : '<button class="primary" data-close>Tushunarli</button>'}
  `, (el) => el.addEventListener('click', (e) => { if (e.target.closest('[data-act="welcome-profile"]')) { closeSheet(); profileSheet(!S.me); } }));
}
let pendingAction = null;
function needProfile(action) { if (S.me) return true; pendingAction = action; profileSheet(true); return false; }

function newProblemSheet() {
  if (!needProfile(newProblemSheet)) return;
  const canElon = S.leader;
  let kind = S.kind && (S.kind !== 'elon' || canElon) ? S.kind : 'muammo', cat = 'Infratuzilma', anon = true;
  const kindKeys = Object.keys(KINDS).filter((k) => k !== 'elon' || canElon);
  openSheet(sheetTop('Post yozish') + `
    <form id="np" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <div class="field">Post turi<div class="chips" id="np-kind">${kindKeys.map((k) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${k === kind}">${KINDS[k].label}</button>`).join('')}</div></div>
      <label class="field">Sarlavha<input id="np-title" maxlength="140" required></label>
      <label class="field">Batafsil<textarea id="np-body" rows="4" maxlength="2000"></textarea></label>
      <div class="field" id="np-catwrap">Yo‘nalish<div class="chips" id="np-cat">${CATS.map((c) => `<button type="button" class="chip" aria-pressed="${c === cat}">${esc(c)}</button>`).join('')}</div></div>
      <button type="button" class="toggle" id="np-anon" role="switch" aria-checked="true"><span style="flex:1"><b style="display:block">Anonim yuborish</b><span class="small">Ismingiz talabalarga ko‘rinmaydi</span></span><span class="sw" aria-hidden="true"></span></button>
      <div class="small" id="np-note"></div>
      <div class="err" id="np-err" role="alert"></div>
      <button class="primary" type="submit">Joylash</button>
    </form>`, (el) => {
    const sync = () => {
      $('#np-title', el).placeholder = KINDS[kind].ph;
      $('#np-body', el).placeholder = KINDS[kind].bph;
      $('#np-catwrap', el).hidden = kind !== 'muammo';
      $('#np-anon', el).hidden = !(kind === 'muammo' || kind === 'savol');
      $('#np-note', el).textContent = kind === 'kerak' ? 'Ismingiz ko‘rinadi, shunda yordam beradiganlar siz bilan bog‘lana oladi.' : kind === 'elon' ? (isAdmin ? 'E’lon Black Knight Team nomidan chiqadi.' : `E’lon «◇ ${(S.me && S.me.position) || 'sizning'}» nomidan chiqadi.`) : '';
      el.querySelectorAll('#np-kind .chip').forEach((x) => x.setAttribute('aria-pressed', x.dataset.k === kind));
    };
    sync();
    $('#np-kind', el).addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; kind = b.dataset.k; sync(); });
    $('#np-cat', el).addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; cat = b.textContent; el.querySelectorAll('#np-cat .chip').forEach((x) => x.setAttribute('aria-pressed', x === b)); });
    $('#np-anon', el).addEventListener('click', (e) => { anon = !anon; e.currentTarget.setAttribute('aria-checked', anon); });
    $('#np', el).addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = $('#np-title', el).value.trim();
      if (title.length < 5) { $('#np-err', el).textContent = 'Sarlavhani biroz batafsilroq yozing (kamida 5 belgi).'; return; }
      const btn = $('button[type=submit]', el); btn.disabled = true;
      try {
        await api('/api/problems', { method: 'POST', body: { uid, kind, title, body: $('#np-body', el).value, category: cat, anon } });
        closeSheet(); toast(KINDS[kind].ok); S.ptab = 'new'; S.kind = ''; S.tab = 'ovoz';
        await Promise.all([loadProblems(), loadStats(), loadMe()]); render();
      } catch (err) { $('#np-err', el).textContent = err.message; btn.disabled = false; }
    });
  });
}

function newEventSheet() {
  const d = new Date(Date.now() + 864e5); d.setHours(15, 0, 0, 0);
  const local = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  openSheet(sheetTop('Yangi tadbir') + `
    <form id="ne" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <label class="field">Nomi<input id="ne-title" maxlength="120" required></label>
      <label class="field">Tavsif<textarea id="ne-desc" rows="3" maxlength="1000"></textarea></label>
      <div class="two"><label class="field">Sana va vaqt<input id="ne-date" type="datetime-local" value="${local}"></label>
      <label class="field">Joylar soni<input id="ne-cap" type="number" min="0" inputmode="numeric" placeholder="0 = cheksiz"></label></div>
      <label class="field">Joy<input id="ne-place" maxlength="80" placeholder="Aktlar zali"></label>
      <div class="err" id="ne-err" role="alert"></div>
      <button class="primary" type="submit">E’lon qilish</button>
    </form>`, (el) => {
    $('#ne', el).addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = $('#ne-title', el).value.trim(), date = $('#ne-date', el).value;
      if (!title || !date) { $('#ne-err', el).textContent = 'Nom va sanani kiriting.'; return; }
      const btn = $('button[type=submit]', el); btn.disabled = true;
      try {
        await api('/api/events', { method: 'POST', body: { title, description: $('#ne-desc', el).value, starts_at: new Date(date).toISOString(), place: $('#ne-place', el).value, capacity: $('#ne-cap', el).value } });
        closeSheet(); toast('Tadbir e’lon qilindi'); await loadEvents(); render();
      } catch (err) { $('#ne-err', el).textContent = err.message; btn.disabled = false; }
    });
  });
}

function adminSheet() {
  if (isAdmin) { adminKey = ''; isAdmin = false; store.del('bk_admin'); toast('Admin rejimidan chiqdingiz'); render(); return; }
  openSheet(sheetTop('Admin kirish') + `
    <form id="ad" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <div class="small">Murojaat holatini o‘zgartirish va tadbir qo‘shish uchun BlackKnight admin kalitini kiriting.</div>
      <label class="field">Admin kaliti<input id="ad-key" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="err" id="ad-err" role="alert"></div>
      <button class="primary" type="submit">Kirish</button>
    </form>`, (el) => {
    $('#ad', el).addEventListener('submit', async (e) => {
      e.preventDefault();
      adminKey = $('#ad-key', el).value.trim();
      await checkAdmin();
      if (!isAdmin) { $('#ad-err', el).textContent = 'Kalit noto‘g‘ri.'; return; }
      store.set('bk_admin', adminKey); closeSheet(); toast('Admin rejimi yoqildi'); render();
    });
  });
}

// ---------- actions
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t || t.closest('.sheet')) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; render(); window.scrollTo(0, 0); refresh(); if (d.tab === 'market' && !store.get('bk_mk_intro')) marketIntro(); return; }
  if (d.kind !== undefined && t.closest('.kinds')) { S.kind = d.kind; if (S.ptab === 'done' && S.kind && S.kind !== 'muammo') S.ptab = 'top'; S.problems = null; render(); await loadProblems(); render(); return; }
  if (d.ptab) { S.ptab = d.ptab; S.problems = null; render(); await loadProblems(); render(); return; }
  if (d.act === 'new') return newProblemSheet();
  if (d.act === 'profile') return profileSheet(false);
  if (d.act === 'theme') return toggleTheme();
  if (d.act === 'welcome') return welcomeSheet();
  if (d.dm) {
    openDm(d.dm, d.user);
    return;
  }
  if (d.act === 'newevent') return newEventSheet();
  if (d.act === 'newlisting') return newListingSheet();
  if (d.listing) return listingSheet(d.listing);
  if (d.mcat !== undefined && t.closest('.kinds')) { S.mcat = d.mcat; S.market = null; render(); await loadMarket(); render(); return; }
  if (d.mview) { S.mmine = d.mview === 'mine'; S.mhidden = d.mview === 'hidden'; S.market = null; render(); await loadMarket(); render(); return; }
  if (d.act === 'mkintro') return marketIntro();
  if (d.act === 'admin') return adminSheet();
  if (d.act === 'share' && S.refLink) {
    const text = 'Black Knight — Millat Umidi talabalari platformasi. Muammo yoz, ovoz ber, kerakli odamni top:';
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(S.refLink) + '&text=' + encodeURIComponent(text);
    if (TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
    return;
  }
  if (d.act === 'copyref' && S.refLink) {
    try { await navigator.clipboard.writeText(S.refLink); toast('Havola nusxalandi'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('reflink')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Havolani belgilab nusxalang'); }
    return;
  }
  if (d.person) return personSheet(d.person);
  if (d.answer) {
    t.disabled = true;
    try { await api(`/api/requests/${d.answer}`, { method: 'POST', body: { uid, action: d.acc === '1' ? 'accept' : 'decline' } }); toast(d.acc === '1' ? 'Qabul qilindi. Endi u «Tanishlarim»da' : 'Rad etildi'); }
    catch (err) { toast(err.message); }
    await Promise.all([loadRequests(), loadContacts()]); render(); return;
  }
  if (d.rmadmin) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Tasdiqlang'; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = 'Olib tashlash'; } }, 3000); return; }
    try { await api('/api/admins/' + encodeURIComponent(d.rmadmin), { method: 'DELETE' }); toast('Admin olib tashlandi'); } catch (err) { toast(err.message); }
    await loadAdmins(); render(); return;
  }
  if (d.open) { S.open[d.open] = !S.open[d.open]; render(); return; }
  if (d.vote) {
    if (!needProfile(null)) return;
    const p = S.problems.find((x) => x.id == d.vote); if (!p) return;
    p.voted = !p.voted; p.votes += p.voted ? 1 : -1; render();
    try { const r = await api(`/api/problems/${p.id}/vote`, { method: 'POST', body: { uid } }); p.voted = r.voted; p.votes = r.votes; }
    catch (err) { p.voted = !p.voted; p.votes += p.voted ? 1 : -1; toast(err.message); }
    render(); return;
  }
  if (d.glink) {
    if (TG && TG.openTelegramLink && d.glink.startsWith('https://t.me/')) TG.openTelegramLink(d.glink); else window.open(d.glink, '_blank');
    return;
  }
  if (d.att) return attendeesSheet(d.att);
  if (d.rsvp) {
    if (!needProfile(null)) return;
    t.disabled = true;
    try { const r = await api(`/api/events/${d.rsvp}/rsvp`, { method: 'POST', body: { uid } }); toast(r.joined ? 'Siz ro‘yxatga yozildingiz' : 'Yozilish bekor qilindi'); }
    catch (err) { toast(err.message); }
    await Promise.all([loadEvents(), loadMe()]); render(); return;
  }
  if (d.status) {
    try { await api(`/api/problems/${d.id}`, { method: 'PATCH', body: { status: d.status } }); toast('Holat: ' + STATUS[d.status]); }
    catch (err) { toast(err.message); }
    await Promise.all([loadProblems(), loadStats()]); render(); return;
  }
  if (d.delp || d.dele) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Rostdan o‘chirilsinmi?'; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = 'O‘chirish'; } }, 3000); return; }
    try { await api(d.delp ? `/api/problems/${d.delp}` : `/api/events/${d.dele}`, { method: 'DELETE' }); toast('O‘chirildi'); }
    catch (err) { toast(err.message); }
    await Promise.all([loadProblems(), loadEvents(), loadStats()]); render(); return;
  }
});
let searchTimer;
let mkTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'mk-q') {
    clearTimeout(mkTimer);
    mkTimer = setTimeout(async () => { S.mq = e.target.value.trim(); await loadMarket(); const box = document.getElementById('mk-list'); if (box) box.innerHTML = marketList(); }, 300);
    return;
  }
  if (e.target.id !== 'ppl-q') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    S.pq = e.target.value.trim(); await loadPeople();
    const box = document.getElementById('ppl-list'); if (box) box.innerHTML = peopleList();
  }, 300);
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'addadmin') return;
  e.preventDefault();
  const inp = document.getElementById('aa-user'); const username = inp.value.trim();
  const posInp = document.getElementById('aa-pos'); const position = posInp.value.trim();
  if (!username) { toast('Telegram username kiriting'); return; }
  if (!position) { toast('Vazifasini yozing'); posInp.focus(); return; }
  try { const r = await api('/api/admins', { method: 'POST', body: { username, position } }); toast(r.name + ' admin qilindi'); inp.value = ''; posInp.value = ''; }
  catch (err) { toast(err.message); }
  await loadAdmins(); render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('.scrim')) { const req = !$('[data-close]'); if (!req) closeSheet(); } });

async function refresh() {
  if (S.tab === 'ovoz') await Promise.all([loadProblems(), loadStats()]);
  else if (S.tab === 'tadbirlar') await loadEvents();
  else if (S.tab === 'odamlar') await loadPeople();
  else if (S.tab === 'market') await loadMarket();
  else await Promise.all([loadMe(), loadMatches(), loadRequests(), loadContacts()]);
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('form');
  if (!$('.scrim') && !typing) render();
}

(async () => {
  render();
  await Promise.all([checkAdmin(), loadMe(), loadStats(), loadProblems()]);
  render();
  loadEvents(); loadMatches(); loadPeople(); loadRequests(); loadContacts();
  if (!S.offline) { if (!store.get('bk_welcome') && profileEmpty(S.me)) welcomeSheet(); else if (!S.me) profileSheet(true); }
  setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
})();
</script>
</body>
</html>
