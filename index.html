<html lang="uz">
<head>

<title>BlackKnight Club</title>

<style>
/* Black Knight Glass: black ground, knight emblem watermark, warm-gold frosted cards, Cinzel crest type */
:root{
  --bg:#050505; --fg:#f4efe4; --muted:rgba(244,239,228,.66); --dim:rgba(244,239,228,.5);
  --gold:#d9b46c; --gold-hi:#f2d9a0; --gold-lo:#a9823f; --gold-bg:rgba(var(--gd),.16); --gold-line:rgba(var(--gd),.5);
  --metal:linear-gradient(135deg,#f2d9a0 0%,#d9b46c 45%,#a9823f 100%);
  --glass:rgba(var(--gd),.05); --glass-2:rgba(var(--gd),.09); --line:rgba(var(--gd),.16); --line-2:rgba(var(--gd),.28);
  --crest:"Cinzel","Trajan Pro",Georgia,serif;
  --blue:#b9c6ff; --blue-bg:rgba(var(--bl),.2); --green:#a6ecbc; --green-bg:rgba(var(--gn),.18); --red:#ffb4a8;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wh:255,255,255; --gd:217,180,108; --gh:242,217,160; --gl:169,130,63; --gn:130,220,160; --bl:140,165,255; --rd:255,180,168; --fgc:245,243,238; --sv:214,219,227;
  --metal-text:var(--metal); --silver:#d6dbe3; --sheet:rgba(18,15,10,.94); --nav:rgba(12,10,6,.72); --scrim:rgba(5,6,12,.55); --emblem:.07;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f1e5; --fg:#1d1810; --muted:rgba(29,24,16,.7); --dim:rgba(29,24,16,.55);
  --wh:29,24,16; --gd:138,100,32; --gh:196,150,60; --gl:138,100,32; --gn:30,120,70; --bl:50,80,200; --rd:190,50,35; --fgc:29,24,16; --sv:91,100,114;
  --gold:#8a6420; --gold-hi:#6e4d12; --gold-lo:#a9823f; --gold-line:rgba(138,100,32,.5);
  --metal:linear-gradient(135deg,#f0d68f 0%,#d9b46c 50%,#bf9446 100%); --metal-text:linear-gradient(135deg,#a9823f 0%,#8a6420 55%,#6e4d12 100%);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.85); --line:rgba(138,100,32,.22); --line-2:rgba(138,100,32,.38);
  --blue:#3550c8; --green:#1f7a46; --red:#b3392a; --silver:#566070;
  --sheet:rgba(250,246,236,.97); --nav:rgba(250,246,236,.82); --scrim:rgba(40,30,10,.42); --emblem:.09;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:500 15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bgmark{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgmark::before{content:"";position:absolute;left:50%;top:-180px;width:560px;height:420px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(var(--gd),.22),rgba(var(--gd),0));}
.bgmark img{position:absolute;left:50%;top:52%;width:min(118vw,560px);transform:translate(-50%,-50%);opacity:var(--emblem);filter:saturate(.9)}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.head{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold-line);box-shadow:0 0 0 3px rgba(var(--gd),.08);flex:none;object-fit:cover;background:#000}
.head .grow{flex:1;min-width:0}
.head .sp{font-family:var(--crest);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.head .uni{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:1px}
.head .team{font-family:var(--crest);font-weight:700;font-size:17px;letter-spacing:.04em;background:var(--metal-text);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.pagetitle{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pagetitle h1{margin:0;font-family:var(--crest);font-weight:700;font-size:26px;letter-spacing:.02em;color:var(--fg);text-wrap:balance}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-line))}
.rule::after{background:linear-gradient(90deg,var(--gold-line),transparent)}
.rule i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;flex:none}
.stat{padding:16px;display:flex;flex-direction:column;gap:12px}
.stat .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--crest);font-size:42px;font-weight:700;line-height:1;background:var(--metal-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:rgba(var(--wh),.12);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--metal);transition:width .4s}
.cta{height:52px;border-radius:18px;border:1px solid var(--gold-line);background:linear-gradient(135deg,rgba(var(--gh),.22),rgba(var(--gl),.18));color:var(--gold-hi);letter-spacing:.02em;font-weight:700;font-size:16px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.seg{display:flex;padding:4px;border-radius:16px;background:rgba(var(--wh),.06);border:1px solid rgba(var(--wh),.12)}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-bg);color:var(--gold-hi)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;padding:12px;text-align:left;width:100%}
.vote{width:50px;min-height:56px;border-radius:16px;border:1px solid rgba(var(--wh),.2);background:rgba(var(--wh),.08);font-weight:700;font-size:15px;line-height:1.15;flex:none;font-variant-numeric:tabular-nums}
.vote[aria-pressed="true"]{border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold)}
.card .body{flex:1;min-width:0}
.card h3{margin:6px 0 0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--dim);margin-top:3px}
.card .more{font-size:14px;color:var(--muted);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.s-yangi{background:rgba(var(--wh),.12);color:var(--muted)}
.s-qabul{background:var(--blue-bg);color:var(--blue)}
.s-jarayonda{background:var(--gold-bg);color:var(--gold)}
.s-hal{background:var(--green-bg);color:var(--green)}
.cat{font-size:11px;color:var(--dim);margin-left:6px}
.kn{color:var(--gold);font-size:13px}
.knpill{background:var(--metal);color:#1a1406}
.ladder{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.ladder i{flex:1;height:1px;background:var(--line-2)}
.ladder span.on{color:var(--gold-hi);font-weight:700}
.pg-mark{text-align:center;font-size:40px;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}.pg-name{text-align:center;font-family:Cinzel,serif;font-weight:700;font-size:20px;color:var(--gold-hi)}
.why{display:flex;flex-direction:column;gap:12px}.why .w{display:flex;gap:12px;align-items:flex-start}.why .w>b{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--metal);color:#1a1406;font-size:15px}.why h3{margin:2px 0 4px;font-size:16px;color:var(--gold-hi)}.why p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}
.kn.ld,.ldname{color:var(--silver)}.ldpill{background:linear-gradient(135deg,#eef1f5,#b9c0ca);color:#15181c}.card.elon.ld{border-color:rgba(var(--sv),.45);background:linear-gradient(135deg,rgba(var(--sv),.08),rgba(140,148,160,.04))}
.svlist{display:flex;flex-direction:column;gap:6px;margin-top:4px}.sv{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(var(--gd),.14)}.sv b{color:var(--gold-hi);min-width:38px;font-variant-numeric:tabular-nums}.sv span{flex:1;font-size:13px;line-height:1.35}.sv small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.reflink{font-size:13px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);color:var(--gold-hi);overflow-wrap:anywhere;user-select:all}
.dot{position:absolute;top:6px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.search{display:flex}
.search input{width:100%;min-height:48px;padding:12px 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--glass);font-size:16px;color:var(--fg)}
.search input:focus{outline:none;border-color:var(--gold-line)}
.person{display:flex;gap:12px;align-items:center;padding:12px;width:100%;text-align:left}
.pava{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;background:var(--gold-bg);border:1px solid var(--gold-line);display:grid;place-items:center;font-family:var(--crest);font-weight:700;font-size:20px;color:var(--gold-hi);overflow:hidden}
.pava img{width:100%;height:100%;object-fit:cover}
.person .body{flex:1;min-width:0}
.person b{display:block;font-size:15px;overflow-wrap:anywhere}
.person .meta{font-size:12px;color:var(--dim);margin-top:2px}
.person .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--green-bg);color:var(--green)}
.tag.l{background:var(--blue-bg);color:var(--blue)}
.psheet{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.psheet .pava{width:84px;height:84px;font-size:34px}
.req{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid rgba(var(--gd),.12)}
.req:first-of-type{border-top:0}
.req .row{display:flex;gap:10px;align-items:center}
.req .acts{display:flex;gap:8px}
.req .acts button{flex:1}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted)}
.linkname{background:none;border:0;padding:0;color:var(--fg);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:3px}
.kinds{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.kinds::-webkit-scrollbar{display:none}
.kinds .chip{flex:none;font-weight:600;color:var(--muted)}
.kinds .chip[aria-pressed="true"]{color:var(--gold-hi)}
.k-savol{background:var(--blue-bg);color:var(--blue)}
.k-kerak{background:var(--green-bg);color:var(--green)}
.k-elon{background:var(--metal);color:#1a1406}
.card.elon{border-color:var(--gold-line);background:linear-gradient(135deg,rgba(var(--gh),.1),rgba(var(--gl),.05))}
.admin{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin button{font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2)}
.admin button.on{border-color:var(--gold-line);color:var(--gold)}
.admin button.del{color:var(--red)}
.admin-rm{margin-left:6px;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--glass-2);color:var(--red)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.hero{padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--glass-2);border-color:var(--line-2);border-radius:26px}
.hero h2{margin:0;font-family:var(--crest);font-size:22px;font-weight:700;line-height:1.2;text-wrap:balance}
.hero p{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.hero .foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--gold-line);background:var(--gold-bg);font-weight:700;font-size:14px;color:var(--fg)}
.btn.done{border-color:rgba(var(--gn),.45);background:var(--green-bg);color:var(--green)}
.btn:disabled{opacity:.5}
.label{font-size:14px;font-weight:700;color:var(--muted);padding-top:4px}
.ev{display:flex;gap:12px;align-items:center;padding:12px}
.date{width:54px;height:58px;border-radius:16px;background:rgba(var(--wh),.1);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date b{font-size:20px;font-weight:800;line-height:1}
.date span{font-size:11px;color:var(--muted)}
.ev .body{flex:1;min-width:0}
.ev h3{margin:0;font-size:15px;font-weight:700}
.join{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:rgba(var(--wh),.08);font-weight:700;font-size:18px;flex:none}
.join[aria-pressed="true"]{border-color:rgba(var(--gn),.45);background:var(--green-bg);color:var(--green)}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border-radius:26px}
.ava{width:76px;height:76px;border-radius:50%;background:var(--gold-bg);border:1px solid var(--gold-line);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--gold)}
.prof h2{margin:0;font-family:var(--crest);font-size:21px;font-weight:700}
.how{margin-top:2px}.how summary{cursor:pointer;font-size:13px;color:var(--gold);font-weight:600;list-style:none}.how summary::-webkit-details-marker{display:none}.how summary::after{content:' ▾'}.how[open] summary::after{content:' ▴'}.how>div{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.prof .chips{justify-content:center}
.nums{display:flex;gap:28px;margin-top:6px;text-align:center}
.nums b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--muted)}
.box{padding:16px;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-family:var(--crest);font-size:16px;font-weight:700;color:var(--gold-hi)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}
button.chip[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold);font-weight:700}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swap div{padding:12px;border-radius:16px;min-width:0}
.swap .t{background:rgba(var(--gn),.12);border:1px solid rgba(var(--gn),.3)}
.swap .l{background:rgba(var(--bl),.12);border:1px solid rgba(var(--bl),.3)}
.swap small{font-size:12px}.swap .t small{color:var(--green)}.swap .l small{color:var(--blue)}
.swap b{display:block;font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.match{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid rgba(var(--wh),.08);font-size:14px}
.match span{color:var(--muted);text-align:right}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px;align-self:center}
nav{border-color:var(--line-2)!important;background:var(--nav)!important;position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));height:64px;border-radius:26px;background:rgba(var(--wh),.1);border:1px solid rgba(var(--wh),.2);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:space-around;padding:0 8px}
nav button{position:relative;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;padding:10px 2px;border-radius:16px;font-weight:600;font-size:11.5px;color:var(--muted)}
/* market */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;width:100%;min-width:0;border-radius:20px}
.mcard .ph{position:relative;aspect-ratio:1/1;background:rgba(var(--wh),.05);overflow:hidden}
.mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .ph .sold{position:absolute;left:8px;top:8px}
.mcard .ph .wn{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(5,5,5,.7);color:var(--gold-hi)}
.mcard .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard .pr{font-weight:800;font-size:15px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.mcard .tt{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mcard .mt{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.off{opacity:.6}
.gallery{position:relative;flex:none;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scrollbar-width:none;border-radius:20px}
.gwrap{position:relative;flex:none}
.gcount{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(5,5,5,.65);color:#fff;pointer-events:none}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior:contain}
.viewer img{flex:none;width:100vw;height:100vh;object-fit:contain;scroll-snap-align:center}
.viewer button{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:16px}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;height:min(444px,calc(100vw - 36px),58vh);min-height:220px;object-fit:contain;border-radius:20px;scroll-snap-align:start;background:rgba(var(--wh),.05);cursor:zoom-in}
.lprice{font-family:var(--crest);font-weight:700;font-size:26px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.seller{display:flex;gap:12px;align-items:center;padding:12px}
.seller .body{flex:1;min-width:0}
.pickers{display:flex;gap:8px;flex-wrap:wrap}
.pick{position:relative;width:84px;height:84px;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);background:rgba(var(--wh),.06)}
.pick img{width:100%;height:100%;object-fit:cover}
.pick button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(5,5,5,.75);color:#fff;font-size:12px;line-height:1}
.pick.add{display:grid;place-items:center;border-style:dashed;color:var(--gold-hi);font-size:26px;cursor:pointer}
.rules{font-size:12px;color:var(--dim);line-height:1.45;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
nav button[aria-current="page"]{background:var(--gold-bg);color:var(--gold)}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json' };
  if (adminKey) headers['x-admin-key'] = adminKey;
  if (TG_INIT) headers['x-tg-init'] = TG_INIT;
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || 'Xatolik yuz berdi'); err.status = res.status; throw err; }
  return data;
}

function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return 'hozir';
  if (s < 3600) return Math.floor(s / 60) + ' daqiqa oldin';
  if (s < 86400) return Math.floor(s / 3600) + ' soat oldin';
  if (s < 7 * 86400) return Math.floor(s / 86400) + ' kun oldin';
  return d.getDate() + '-' + MONTHS[d.getMonth()];
}
const hhmm = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function until(iso) {
  const days = Math.round((new Date(iso).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 864e5);
  if (days <= 0) return 'Bugun';
  if (days === 1) return 'Ertaga';
  return days + ' kundan keyin';
}

function toast(msg) {

}

function ladder(p) {
  if (p.kind !== 'muammo') return null;
  if (p.status === 'hal') return null;
  if (p.dekanat || p.votes >= DEKANAT_AT) return { pct: 100, txt: 'Dekanatga olib chiqildi — javob kutilmoqda' };
  if (p.status === 'yangi') return { pct: Math.min(100, Math.round(p.votes / REVIEW_AT * 100)), txt: `Ko‘rib chiqishgacha: ${p.votes} / ${REVIEW_AT} ovoz` };
  return { pct: Math.min(100, p.votes), txt: `Dekanatgacha: ${p.votes} / ${DEKANAT_AT} ovoz` };
}

// Shrinks a photo on the phone before upload: longest side ≤ 1080px, JPEG.
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let out = '';
      for (const [max, qlt] of [[1080, 0.78], [900, 0.66], [720, 0.58]]) {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', qlt);
        if (out.length < 600000) break;
      }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Rasmni ochib bo‘lmadi')); };
    img.src = url;
  });
}

// Wide club background: centre-cropped to 1000×500 JPEG.
function shrinkCover(file) {
  return new Promise((ok, no) => {
    if (!file.type.startsWith('image/')) return no(new Error('Rasm tanlang'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const W = 1000, H = 500, c = document.createElement('canvas'); c.width = W; c.height = H;
      const k = Math.max(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;
      const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('Bu faylni ochib bo‘lmadi')); };
    im.src = url;
  });
}
const clubMini = (c) => c.logo_v ? `<img class="cmini" src="${clubImg(c.id, c.logo_v)}" alt="">` : esc(c.emoji || '');
// Square 256px; stickers and PNGs keep transparency and fit whole, photos fill the square.
function shrinkLogo(file) {
  return new Promise((ok, no) => {
    if (!file.type.startsWith('image/')) return no(new Error('Rasm yoki stiker tanlang'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const N = 256, c = document.createElement('canvas'); c.width = N; c.height = N;
      const x = c.getContext('2d');
      const fit = /png|webp|gif|svg/.test(file.type) ? Math.min : Math.max;
      const k = fit(N / im.naturalWidth, N / im.naturalHeight);
      const w = im.naturalWidth * k, h = im.naturalHeight * k;
      x.drawImage(im, (N - w) / 2, (N - h) / 2, w, h);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', 0.9);
      if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/png');
      ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('Bu faylni ochib bo‘lmadi — boshqa rasm tanlang')); };
    im.src = url;
  });
}

      <button class="btn ${c.joined ? 'done' : ''}" data-cjoin="${c.id}" aria-pressed="${c.joined}">${c.mine ? 'Rahbar' : c.joined ? '✓ A’zosiz' : 'Qo‘shilish'}</button>

}

async function attendanceSheet(eventId, clubId) {

    const n = r.people.filter((p) => p.present).length;
    $('#at-body', el).innerHTML = `<div class="small"><b style="display:inline">${esc(r.event.title)}</b> — kelganlarni belgilang. Har bir belgi talabaga <b style="display:inline;color:var(--gold-hi)">+${r.points} ball</b> beradi.</div>

async function taskSheet(id) {

// ---------- actions
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t || t.closest('.sheet')) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; render(); window.scrollTo(0, 0); refresh(); if (d.tab === 'market' && !store.get('bk_mk_intro')) marketIntro(); return; }
  if (d.kind !== undefined && t.closest('.kinds')) { S.kind = d.kind; if (S.ptab === 'done' && S.kind && S.kind !== 'muammo') S.ptab = 'top'; S.problems = null; render(); await loadProblems(); render(); return; }
  if (d.ptab) { S.ptab = d.ptab; S.problems = null; render(); await loadProblems(); render(); return; }
  if (d.act === 'new') return newProblemSheet();
  if (d.newclub !== undefined) return clubFormSheet(null);
  if (d.ctab) { S.clubTab = d.ctab; render(); return; }
  if (d.club) return clubSheet(d.club);
  if (d.evopen) return eventSheet(d.evopen);
  if (d.cjoin) {
    const c = (S.clubs || []).find((x) => x.id == d.cjoin);
    if (c && c.mine) return clubSheet(c.id);
    if (!needProfile(null)) return;
    t.disabled = true;
    try { const r = await api(`/api/clubs/${d.cjoin}/join`, { method: 'POST', body: { uid } }); toast(r.joined ? 'Klubga qo‘shildingiz' : 'Klubdan chiqdingiz'); } catch (err) { toast(err.message); }
    await loadClubs(); render(); return;
  }
  if (d.newtask !== undefined) return newTaskSheet(null);
  if (d.vtask) return taskSheet(d.vtask);
  if (d.cert !== undefined) return certificate();
  if (d.vjoin) {
    if (!needProfile(null)) return;
    t.disabled = true;
    try { const r = await api(`/api/vol/tasks/${d.vjoin}/join`, { method: 'POST', body: { uid } }); toast(r.joined ? 'Yozildingiz — rahmat!' : 'Bekor qilindi'); } catch (err) { toast(err.message); }
    await loadVol(); render(); return;
  }
  if (d.act === 'onboard') return onboardSheet();
  if (d.go === 'faq') { S.tab = 'ovoz'; S.kind = 'savol'; S.ptab = 'top'; S.problems = null; render(); window.scrollTo(0, 0); await Promise.all([loadProblems(), loadStats()]); render(); return; }
  if (d.act === 'profile') return profileSheet(false);
  if (d.act === 'theme') { toggleTheme(); if (S.tab === 'koproq') render(); return; }
  if (d.act === 'welcome') return welcomeSheet();
  if (d.dm) {
    openDm(d.dm, d.user);
    return;
  }
  if (d.act === 'newevent') return newEventSheet();
  if (d.act === 'newlisting') return newListingSheet();
  if (d.listing) return listingSheet(d.listing);
  if (d.mcat !== undefined && t.closest('.kinds')) { S.mcat = d.mcat; S.market = null; render(); await loadMarket(); render(); return; }
  if (d.mview) { S.mmine = d.mview === 'mine'; S.mhidden = d.mview === 'hidden'; S.market = null; render(); await loadMarket(); render(); return; }
  if (d.act === 'mkintro') return marketIntro();
  if (d.act === 'admin') return adminSheet();
  if (d.posv) return positionSheet(d.posv);
  if (d.act === 'hremind') { try { await api('/api/head/remind', { method: 'POST', body: { uid } }); toast('Eslatma botga yuborildi'); } catch (err) { toast(err.message); } return; }
  if (d.hst) {
    const [id, st] = d.hst.split(':'); t.disabled = true;
    try { await api(`/api/problems/${id}`, { method: 'PATCH', body: { status: st } }); toast('Holat: ' + STATUS[st] + ' — muallifga xabar ketdi'); } catch (err) { toast(err.message); }
    await Promise.all([loadHead(), loadMe()]); render(); return;
  }
  if (d.act === 'share' && S.refLink) {
    const text = 'Black Knight — Millat Umidi talabalari platformasi. Muammo yoz, ovoz ber, kerakli odamni top:';
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(S.refLink) + '&text=' + encodeURIComponent(text);
    if (TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
    return;
  }
  if (d.act === 'allcontacts') { S.allContacts = true; render(); return; }
  if (d.act === 'copyref' && S.refLink) {
    try { await navigator.clipboard.writeText(S.refLink); toast('Havola nusxalandi'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('reflink')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Havolani belgilab nusxalang'); }
    return;
  }
  if (d.person) return personSheet(d.person);
  if (d.answer) {
    t.disabled = true;
    try { await api(`/api/requests/${d.answer}`, { method: 'POST', body: { uid, action: d.acc === '1' ? 'accept' : 'decline' } }); toast(d.acc === '1' ? 'Qabul qilindi. Endi u «Tanishlarim»da' : 'Rad etildi'); }
    catch (err) { toast(err.message); }
    await Promise.all([loadRequests(), loadContacts()]); render(); return;
  }
  if (d.rmadmin) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Tasdiqlang'; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = 'Olib tashlash'; } }, 3000); return; }
    try { await api('/api/admins/' + encodeURIComponent(d.rmadmin), { method: 'DELETE' }); toast('Admin olib tashlandi'); } catch (err) { toast(err.message); }
    await loadAdmins(); render(); return;
  }
  if (d.open) return problemSheet(d.open);
  if (d.vote) {
    if (!needProfile(null)) return;
    const p = S.problems.find((x) => x.id == d.vote); if (!p) return;
    p.voted = !p.voted; p.votes += p.voted ? 1 : -1; render();
    try { const r = await api(`/api/problems/${p.id}/vote`, { method: 'POST', body: { uid } }); p.voted = r.voted; p.votes = r.votes; }
    catch (err) { p.voted = !p.voted; p.votes += p.voted ? 1 : -1; toast(err.message); }
    render(); return;
  }
  if (d.glink) {
    if (TG && TG.openTelegramLink && d.glink.startsWith('https://t.me/')) TG.openTelegramLink(d.glink); else window.open(d.glink, '_blank');
    return;
  }
  if (d.att) return attendeesSheet(d.att);
  if (d.rsvp) {
    if (!needProfile(null)) return;
    t.disabled = true;
    try { const r = await api(`/api/events/${d.rsvp}/rsvp`, { method: 'POST', body: { uid } }); toast(r.joined ? 'Siz ro‘yxatga yozildingiz' : 'Yozilish bekor qilindi'); }
    catch (err) { toast(err.message); }
    await Promise.all([loadEvents(), loadMe()]); render(); return;
  }
  if (d.status) {
    try { await api(`/api/problems/${d.id}`, { method: 'PATCH', body: { status: d.status } }); toast('Holat: ' + STATUS[d.status]); }
    catch (err) { toast(err.message); }
    await Promise.all([loadProblems(), loadStats()]); render(); return;
  }
  if (d.delp || d.dele) {
    if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Rostdan o‘chirilsinmi?'; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ''; t.textContent = 'O‘chirish'; } }, 3000); return; }
    try { await api(d.delp ? `/api/problems/${d.delp}` : `/api/events/${d.dele}`, { method: 'DELETE' }); toast('O‘chirildi'); }
    catch (err) { toast(err.message); }
    await Promise.all([loadProblems(), loadEvents(), loadStats()]); render(); return;
  }
});
let searchTimer;
let mkTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'mk-q') {
    clearTimeout(mkTimer);
    mkTimer = setTimeout(async () => { S.mq = e.target.value.trim(); await loadMarket(); const box = document.getElementById('mk-list'); if (box) box.innerHTML = marketList(); }, 300);
    return;
  }
  if (e.target.id !== 'ppl-q') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    S.pq = e.target.value.trim(); await loadPeople();
    const box = document.getElementById('ppl-list'); if (box) box.innerHTML = peopleList();
  }, 300);
});
document.addEventListener('change', async (e) => {
  const id = e.target.dataset && e.target.dataset.hroute; if (!id || !e.target.value) return;
  const to = e.target.value, name = e.target.selectedOptions[0].textContent;
  try { await api(`/api/problems/${id}/route`, { method: 'POST', body: { uid, to } }); toast('Yo‘naltirildi: ' + name); } catch (err) { toast(err.message); }
  await Promise.all([loadHead(), loadMe()]); render();
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'addadmin') return;
  e.preventDefault();
  const inp = document.getElementById('aa-user'); const username = inp.value.trim();
  const posInp = document.getElementById('aa-pos'); const position = posInp.value.trim();
  if (!username) { toast('Telegram username kiriting'); return; }
  if (!position) { toast('Vazifasini yozing'); posInp.focus(); return; }
  try { const r = await api('/api/admins', { method: 'POST', body: { username, position } }); toast(r.name + ' admin qilindi'); inp.value = ''; posInp.value = ''; }
  catch (err) { toast(err.message); }
  await loadAdmins(); render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('.scrim')) { const req = !$('[data-close]'); if (!req) closeSheet(); } });

async function refresh() {
  if (S.tab === 'ovoz') await Promise.all([loadProblems(), loadStats()]);
  else if (S.tab === 'tadbirlar') await loadEvents();
  else if (S.tab === 'odamlar') await loadPeople();
  else if (S.tab === 'market') await loadMarket();
  else if (S.tab === 'jamoa') await Promise.all([loadTeamData(), loadMe(), checkAdmin()]);
  else if (S.tab === 'bolim') await Promise.all([loadHead(), loadMe()]);
  else if (S.tab === 'koproq') await loadMe();
  else if (S.tab === 'klublar') await Promise.all([loadClubs(), checkAdmin()]);
  else if (S.tab === 'volontyor') await Promise.all([loadVol(), loadMe(), loadClubs(), checkAdmin()]);
  else await Promise.all([loadMe(), loadMatches(), loadRequests(), loadContacts()]);
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('form');
  if (!$('.scrim') && !typing) render();
}

(async () => {
  render();
  await Promise.all([checkAdmin(), loadMe(), loadStats(), loadProblems()]);
  render();
  loadEvents(); loadMatches(); loadPeople(); loadRequests(); loadContacts();
  // Deep links: ?startapp=job_<seat> opens that vacancy; #bolim opens the Head's desk.
  const sp = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('tgWebAppStartParam') || '';
  if (sp.startsWith('job_')) { S.tab = 'jamoa'; await loadTeamData(); render(); positionSheet(sp.slice(4)); }
  const want = new URLSearchParams(location.search).get('open') || location.hash.slice(1);
  const clubLinkId = (sp.match(/^club_(\d+)$/) || (want || '').match(/^club_(\d+)$/) || [])[1];
  if (sp.startsWith('job_')) {}
  else if (clubLinkId) {
    S.tab = 'klublar'; await loadClubs(); render();
    const c = (S.clubs || []).find((x) => x.id == clubLinkId);
    if (c && !c.joined && sp) { try { await api(`/api/clubs/${c.id}/join`, { method: 'POST', body: { uid } }); toast(`${c.name} klubiga qo‘shildingiz`); await loadClubs(); render(); } catch (e) {} }
    clubSheet(clubLinkId);
  }
  else if (want === 'bolim' && S.head) { S.tab = 'bolim'; await loadHead(); render(); }
  else if (want === 'jamoa') { S.tab = 'jamoa'; await loadTeamData(); render(); }
  else if ((want === 'profil' || sp === 'profil') && !S.offline) { store.set('bk_welcome', '1'); profileSheet(false); }
  if (!S.offline && !sp.startsWith('job_') && !clubLinkId && want !== 'profil' && sp !== 'profil') {
    const next = () => { if (!store.get('bk_welcome') && profileEmpty(S.me)) welcomeSheet(); else if (!S.me) profileSheet(true); };
    if (!store.get('bk_onb')) onboardSheet(next); else next();
  }
  setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
})();
</script>
