<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex,nofollow">

<title>BlackKnight Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505; --bg-2:#0c0b09; --fg:#f4efe4; --muted:rgba(244,239,228,.66); --dim:rgba(244,239,228,.46);
  --gold:#d9b46c; --gold-hi:#f2d9a0; --gold-lo:#a9823f; --gold-bg:rgba(217,180,108,.14); --gold-line:rgba(217,180,108,.5);
  --metal:linear-gradient(135deg,#f2d9a0 0%,#d9b46c 45%,#a9823f 100%);
  --glass:rgba(217,180,108,.05); --glass-2:rgba(217,180,108,.09); --line:rgba(217,180,108,.15); --line-2:rgba(217,180,108,.28);
  --blue:#b9c6ff; --blue-bg:rgba(140,165,255,.18); --green:#a6ecbc; --green-bg:rgba(130,220,160,.16); --red:#ffb4a8; --red-bg:rgba(255,140,120,.14);
  --crest:"Cinzel",Georgia,serif; --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:500 14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;left:50%;top:-220px;width:720px;height:460px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(217,180,108,.16),transparent);pointer-events:none;z-index:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top img{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold-line);object-fit:cover;background:#000}
.top .t{flex:1;min-width:0}
.top .k{font-family:var(--crest);font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.top h1{margin:0;font-family:var(--crest);font-size:19px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.ibtn{height:38px;min-width:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.ibtn:hover{color:var(--gold-hi);border-color:var(--line-2)}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:6px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;background:linear-gradient(var(--bg) 70%,transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid transparent;background:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--gold-bg);border-color:var(--line-2);color:var(--gold-hi)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red-bg);color:var(--red);font-size:11px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-width:0}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.card h2 small{letter-spacing:0;text-transform:none;color:var(--dim);font-weight:600;font-size:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--crest);font-size:28px;font-weight:700;line-height:1.05;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--dim)}
.up{color:var(--green)}.dn{color:var(--red)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2)}
.alert .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;background:var(--gold-bg)}
.alert.r .ic{background:var(--red-bg)}.alert.g .ic{background:var(--green-bg)}
.alert .tx{flex:1;min-width:0;font-size:13.5px}.alert .tx b{color:var(--gold-hi)}
.alert button{flex:none}
.btn{height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--gold-line);background:linear-gradient(135deg,rgba(242,217,160,.2),rgba(169,130,63,.14));color:var(--gold-hi);font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{border-color:var(--line);background:var(--glass-2);color:var(--muted)}
.btn.red{border-color:rgba(255,160,140,.35);background:var(--red-bg);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--dim);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:9px}
.hb .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;align-items:center;gap:10px;font-size:13px}
.hb .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb .r b{text-align:right;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--metal)}
.track i.g{background:var(--green)}
.funnel{display:flex;flex-direction:column;gap:7px}
.fs{position:relative;height:38px;border-radius:10px;background:rgba(255,255,255,.05);overflow:hidden}
.fs i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(242,217,160,.42),rgba(169,130,63,.26));border-right:1px solid var(--gold-line)}
.fs span{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 12px;font-size:13px;font-weight:600}
.fs small{color:var(--dim);font-weight:600;margin-left:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m small{display:block;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .num{font-family:var(--crest);font-weight:700;color:var(--gold-hi);font-size:16px;font-variant-numeric:tabular-nums}
.av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--gold-bg);display:grid;place-items:center;font-weight:800;color:var(--gold);font-size:13px;border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.p-yangi{background:var(--gold-bg);color:var(--gold-hi)}.p-qabul{background:var(--blue-bg);color:var(--blue)}.p-jarayonda{background:rgba(200,160,255,.16);color:#dcc6ff}.p-hal{background:var(--green-bg);color:var(--green)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
input.in,select.in,textarea.in{width:100%;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.35);outline:none}
textarea.in{height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.45}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--gold-line)}
select.in{width:auto;padding-right:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--line-2);color:var(--gold-hi)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;white-space:nowrap;user-select:none}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--glass-2)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:68vh;border-radius:14px;border:1px solid var(--line)}
.post{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;gap:8px}
.post .h{display:flex;gap:8px;align-items:flex-start}
.post .h b{flex:1;font-size:15px}
.post p{margin:0;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.post .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
.post .acts{display:flex;gap:6px;flex-wrap:wrap}
.post .acts button{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--glass-2);font-size:12px;font-weight:700;color:var(--muted)}
.post .acts button[aria-pressed="true"]{border-color:var(--gold-line);color:var(--gold-hi);background:var(--gold-bg)}
.post .acts button.d{color:var(--red);margin-left:auto}
.votes{font-family:var(--crest);font-weight:700;color:var(--gold-hi);font-size:18px;text-align:center;line-height:1}
.votes small{display:block;font-family:var(--font);font-size:10px;color:var(--dim);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.form{display:grid;gap:10px}
.row2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.empty{padding:28px;text-align:center;color:var(--dim)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media(min-width:700px){.scrim{align-items:center}}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#0d0c0a;border:1px solid var(--line-2);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{border-radius:22px}}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet .sh h3{flex:1;margin:0;font-family:var(--crest);font-size:18px;color:var(--gold-hi)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{padding:10px;border-radius:12px;background:var(--glass-2);text-align:center}
.kv b{display:block;font-family:var(--crest);font-size:20px;color:var(--gold-hi)}
.kv span{font-size:11px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#1a1712;border:1px solid var(--gold-line);color:var(--gold-hi);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login img{width:84px;height:84px;border-radius:50%;border:1px solid var(--gold-line);margin-bottom:14px}
.login h1{font-family:var(--crest);margin:0 0 6px;font-size:22px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.skel{height:84px;border-radius:16px;background:linear-gradient(90deg,var(--glass) 0%,var(--glass-2) 50%,var(--glass) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.preview{padding:12px 14px;border-radius:14px 14px 14px 4px;background:#1b2330;border:1px solid rgba(140,165,255,.2);white-space:pre-wrap;word-break:break-word;font-size:14px}
.preview .pb{margin-top:10px;padding:8px;border-radius:9px;background:rgba(255,255,255,.08);text-align:center;font-weight:700;font-size:13px;color:var(--blue)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.hide-sm{display:none}@media(min-width:760px){.hide-sm{display:table-cell}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap" id="app"><div class="skel" style="margin-top:20vh"></div></div>
<script>
(() => {
'use strict';
const API = 'https://br-steep-haze-b9tabbet-api.compute.c-7.eu-central-1.aws.neon.tech';
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#050505'); TG.setBackgroundColor && TG.setBackgroundColor('#050505'); } catch (e) {} }
const TG_INIT = TG && TG.initData ? TG.initData : '';
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
let adminKey = store.get('bk_admin') || '';

const STATUS = { yangi: 'Yangi', qabul: 'Qabul qilindi', jarayonda: 'Jarayonda', hal: 'Hal qilindi' };
const KIND = { muammo: 'Muammo', savol: 'Savol', kerak: 'Kerak', elon: 'E’lon' };
const CATS = ["O'quv jarayoni", 'Ustozlar bilan', 'Infratuzilma', 'Yotoqxona', 'Boshqa'];
const MONTHS = ['yan', 'fev', 'mar', 'apr', 'may', 'iyn', 'iyl', 'avg', 'sen', 'okt', 'noy', 'dek'];
const WD = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
const TABS = [['home', 'Umumiy'], ['posts', 'Murojaatlar'], ['people', 'Odamlar'], ['events', 'Tadbirlar'], ['send', 'Xabar yuborish'], ['team', 'Jamoa']];

const S = { tab: (location.hash.slice(1) || 'home'), days: 30, dash: null, posts: null, pf: { status: '', kind: '', cat: '', q: '' }, users: null, botOnly: [], uf: { filter: 'all', q: '', sort: 'created_at', dir: -1 }, admins: null, segs: null, bc: { text: '', segment: 'all', button: true }, sending: false };
if (!TABS.some((t) => t[0] === S.tab)) S.tab = 'home';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
const nf = (n) => (n == null ? '—' : Number(n).toLocaleString('ru-RU').replace(/,/g, ' '));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const ago = (iso) => {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'hozirgina'; if (s < 3600) return Math.floor(s / 60) + ' daq oldin'; if (s < 86400) return Math.floor(s / 3600) + ' soat oldin';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' kun oldin';
  return fdate(iso);
};
const fdate = (iso, time) => { if (!iso) return '—'; const d = new Date(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()] + (time ? ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : ''); };
const initials = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();
const avatar = (u) => (u.photo_url ? `<img class="av" src="${esc(u.photo_url)}" alt="" loading="lazy">` : `<span class="av" aria-hidden="true">${esc(initials(u.name))}</span>`);
const tgLink = (u) => (u.username ? `https://t.me/${u.username}` : u.id && u.id.startsWith('tg') ? `tg://user?id=${u.id.slice(2)}` : '');

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json' };
  if (adminKey) headers['x-admin-key'] = adminKey;
  if (TG_INIT) headers['x-tg-init'] = TG_INIT;
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || 'Xatolik yuz berdi'); err.status = res.status; throw err; }
  return data;
}
let toastT;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
function haptic(k) { try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(k || 'success'); } catch (e) {} }

// ---------- CSV
function csv(name, rows, cols) {
  if (!rows.length) return toast('Eksport uchun ma’lumot yo‘q');
  cols = cols || Object.keys(rows[0]);
  const cell = (v) => { if (v == null) return ''; if (Array.isArray(v)) v = v.join('; '); v = String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const body = '﻿' + [cols.join(','), ...rows.map((r) => cols.map((c) => cell(r[c])).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv;charset=utf-8' }));
  a.download = `blackknight-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV yuklandi: ' + rows.length + ' qator');
}

// ---------- charts (plain SVG, no libraries)
function lineChart(series, keys) {
  const W = 640, H = 200, P = { l: 30, r: 8, t: 10, b: 22 };
  const n = series.length; if (!n) return '';
  const max = Math.max(1, ...series.flatMap((d) => keys.map((k) => d[k.key])));
  const nice = max <= 5 ? 5 : Math.ceil(max / 5) * 5;
  const x = (i) => P.l + (n === 1 ? 0 : (i * (W - P.l - P.r)) / (n - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - v / nice);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = (nice / 4) * i; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(217,180,108,.1)"/><text x="${P.l - 6}" y="${y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`; }
  const step = Math.ceil(n / 7);
  series.forEach((d, i) => { if (i % step === 0 || i === n - 1) { const dt = new Date(d.day); g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${dt.getDate()} ${MONTHS[dt.getMonth()]}</text>`; } });
  keys.forEach((k, ki) => {
    const pts = series.map((d, i) => `${x(i).toFixed(1)},${y(d[k.key]).toFixed(1)}`);
    if (ki === 0) g += `<path d="M${pts[0]} L${pts.join(' L')} L${x(n - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#ga)" opacity=".9"/>`;
    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${k.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${k.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
  });
  // invisible hover targets with native tooltips
  const bw = (W - P.l - P.r) / Math.max(1, n - 1);
  series.forEach((d, i) => { g += `<rect x="${x(i) - bw / 2}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="transparent"><title>${d.day}\n${keys.map((k) => k.label + ': ' + d[k.key]).join('\n')}</title></rect>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${keys.map((k) => k.label).join(', ')} kunlar bo‘yicha"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d9b46c" stop-opacity=".32"/><stop offset="1" stop-color="#d9b46c" stop-opacity="0"/></linearGradient></defs>${g}</svg></div>
    <div class="legend">${keys.map((k) => `<span><i style="background:${k.color}"></i>${k.label} · <b>${nf(series.reduce((a, d) => a + d[k.key], 0))}</b></span>`).join('')}</div>`;
}
function columns(data, labelFn, valKey) {
  const W = 640, H = 150, P = { l: 4, r: 4, t: 14, b: 20 };
  const n = data.length, max = Math.max(1, ...data.map((d) => d[valKey]));
  const bw = (W - P.l - P.r) / n;
  let g = '';
  data.forEach((d, i) => {
    const h = ((H - P.t - P.b) * d[valKey]) / max, xx = P.l + i * bw + bw * 0.15, yy = H - P.b - h;
    g += `<rect x="${xx}" y="${yy}" width="${bw * 0.7}" height="${Math.max(h, 1)}" rx="3" fill="${d[valKey] === max ? '#f2d9a0' : 'rgba(217,180,108,.55)'}"><title>${labelFn(d)}: ${d[valKey]}</title></rect>`;
    if (d[valKey]) g += `<text x="${xx + bw * 0.35}" y="${yy - 3}" text-anchor="middle" style="fill:var(--muted)">${d[valKey]}</text>`;
    if (n <= 12 || i % 3 === 0) g += `<text x="${xx + bw * 0.35}" y="${H - 5}" text-anchor="middle">${labelFn(d)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function hbars(rows, label, val, opts = {}) {
  if (!rows.length) return '<div class="empty">Ma’lumot yo‘q</div>';
  const max = Math.max(1, ...rows.map((r) => r[val]));
  return `<div class="hb">${rows.map((r) => `<div class="r"><span title="${esc(r[label])}">${esc(r[label])}</span><div class="track"><i style="width:${(100 * (opts.done ? r[val] - r[opts.done] : r[val])) / max}%"></i>${opts.done ? `<i class="g" style="width:${(100 * r[opts.done]) / max}%"></i>` : ''}</div><b>${nf(r[val])}</b></div>`).join('')}</div>`;
}

// ---------- sheet
function openSheet(html) { closeSheet(); const s = document.createElement('div'); s.className = 'scrim'; s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; s.addEventListener('click', (e) => { if (e.target === s || e.target.closest('[data-close]')) closeSheet(); }); document.body.appendChild(s); }
function closeSheet() { const s = $('.scrim'); if (s) s.remove(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

// ---------- loading
async function loadDash() { try { S.dash = await api('/api/admin/dashboard?days=' + S.days); } catch (e) { toast(e.message); } }
async function loadPosts() { const f = S.pf; const qs = new URLSearchParams({ status: f.status, kind: f.kind, cat: f.cat, q: f.q }); try { S.posts = (await api('/api/admin/problems?' + qs)).problems; } catch (e) { toast(e.message); S.posts = []; } }
async function loadUsers() { try { const r = await api('/api/admin/users?' + new URLSearchParams({ filter: S.uf.filter, q: S.uf.q })); S.users = r.users; if (S.uf.filter === 'all' && !S.uf.q) S.botOnly = r.bot_only; } catch (e) { toast(e.message); S.users = []; } }
async function loadTeam() { try { S.admins = (await api('/api/admins')).admins; } catch (e) { toast(e.message); S.admins = []; } }
async function loadSegs() { try { S.segs = await api('/api/admin/segments'); } catch (e) { toast(e.message); } }
async function load(t, force) {
  const jobs = [];
  if (!S.dash || force) jobs.push(loadDash());
  if (t === 'posts' && (!S.posts || force)) jobs.push(loadPosts());
  if (t === 'people' && (!S.users || force)) jobs.push(loadUsers());
  if (t === 'team' && (!S.admins || force)) jobs.push(loadTeam());
  if (t === 'send' && (!S.segs || force)) jobs.push(loadSegs());
  if (!jobs.length) return;
  await Promise.all(jobs);
  if (S.tab === t) { const keep = document.activeElement && document.activeElement.id; render(); if (keep && $('#' + keep)) { const el = $('#' + keep); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}

// ---------- events
let qT;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'pq') { S.pf.q = t.value; clearTimeout(qT); qT = setTimeout(() => load('posts', true), 350); }
  if (t.id === 'uq') { S.uf.q = t.value; clearTimeout(qT); qT = setTimeout(() => load('people', true), 350); }
  if (t.id === 'bctext') { S.bc.text = t.value; const pv = $('.preview'); if (pv) pv.innerHTML = (S.bc.text ? fmtPreview(S.bc.text) : '<span class="dim">Matn shu yerda ko‘rinadi</span>') + (S.bc.button ? '<div class="pb">Black Knight’ni ochish</div>' : ''); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'pcat') { S.pf.cat = t.value; S.posts = null; render(); load('posts', true); }
  if (t.id === 'bcseg') { S.bc.segment = t.value; render(); }
  if (t.id === 'bcbtn') { S.bc.button = t.checked; render(); }
});
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button,[data-user],[data-sort]');
  if (!b) return;
  const d = b.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.days) { S.days = +d.days; S.dash = null; render(); await loadDash(); return render(); }
  if (d.pf) { const [k, v] = d.pf.split(':'); S.pf[k] = v; S.posts = null; render(); return load('posts', true); }
  if (d.uf) { S.uf.filter = d.uf; S.users = null; render(); return load('people', true); }
  if (d.sort) { if (S.uf.sort === d.sort) S.uf.dir *= -1; else { S.uf.sort = d.sort; S.uf.dir = ['name', 'major'].includes(d.sort) ? 1 : -1; } return render(); }
  if (d.user) return userSheet(d.user);
  if (d.act === 'refresh') { toast('Yangilanmoqda…'); S.segs = null; return load(S.tab, true); }
  if (d.act === 'logout') { store.del('bk_admin'); adminKey = ''; return boot(); }
  if (d.act && d.act.startsWith('go:')) { const [, t, st] = d.act.split(':'); if (t === 'posts') { S.pf = { status: st, kind: st ? 'muammo' : '', cat: '', q: '' }; S.posts = null; } return setTab(t); }
  if (d.act && d.act.startsWith('seg:')) { S.bc.segment = d.act.slice(4); if (!S.bc.text && ['noapp', 'nofill'].includes(S.bc.segment)) S.bc.text = TEMPLATES[0][1]; return setTab('send'); }
  if (d.act === 'newevent') { if (S.tab !== 'events') setTab('events'); return eventForm(); }
  if (d.act === 'csv-posts') return csv('postlar', S.posts || [], ['id', 'kind', 'category', 'status', 'title', 'body', 'author', 'votes', 'created_at', 'resolved_at']);
  if (d.act === 'csv-users') return csv('azolar', sortedUsers(), ['name', 'username', 'major', 'year', 'interests', 'teach', 'learn', 'points', 'posts', 'votes', 'votes_recv', 'invites_ok', 'events', 'hours', 'knight_no', 'role', 'position', 'invited_by', 'last_seen', 'created_at']);
  if (d.act === 'csv-bot') return csv('faqat-bot', S.botOnly);
  if (d.csvatt) return csv('ishtirokchilar-' + d.csvatt, S.lastAtt || [], ['name', 'username', 'major', 'year', 'src']);
  if (d.export) { try { const r = await api('/api/admin/export/' + d.export); return csv(d.export, r.rows); } catch (err) { return toast(err.message); } }
  if (d.tpl) { S.bc.text = TEMPLATES[+d.tpl][1]; return render(); }

  if (d.st) {
    const [id, st] = d.st.split(':');
    const p = S.posts.find((x) => x.id === +id); if (!p || p.status === st) return;
    const prev = p.status; p.status = st; if (st === 'hal') p.resolved_at = new Date().toISOString(); render();
    try { await api('/api/problems/' + id, { method: 'PATCH', body: { status: st } }); haptic(); toast(`«${STATUS[st]}» — muallifga xabar ketdi`); S.dash = null; loadDash(); }
    catch (err) { p.status = prev; render(); toast(err.message); }
    return;
  }
  if (d.delp) {
    if (!confirm('Bu post o‘chirilsinmi? Ovozlari ham o‘chadi.')) return;
    try { await api('/api/problems/' + d.delp, { method: 'DELETE' }); S.posts = S.posts.filter((x) => x.id !== +d.delp); render(); toast('O‘chirildi'); S.dash = null; loadDash(); } catch (err) { toast(err.message); }
    return;
  }
  if (d.role !== undefined && d.role) {
    const [id, role] = d.role.split(':');
    try { await api(`/api/people/${encodeURIComponent(id)}/role`, { method: 'POST', body: { role: role || null } }); toast(role ? 'Volontyor qilindi' : 'Olib tashlandi'); await loadUsers(); render(); userSheet(id); } catch (err) { toast(err.message); }
    return;
  }
  if (d.mkadmin) {
    const pos = prompt('Jamoadagi mas’uliyati (ixtiyoriy):', '') ;
    if (pos === null) return;
    try { const r = await api('/api/admins', { method: 'POST', body: { username: d.mkadmin, position: pos } }); toast(r.name + ' jamoaga qo‘shildi'); closeSheet(); S.admins = null; loadUsers().then(render); } catch (err) { toast(err.message); }
    return;
  }
  if (d.delsv) {
    if (!confirm('Bu yozuv o‘chirilsinmi?')) return;
    try { await api('/api/service/entry/' + d.delsv, { method: 'DELETE' }); toast('O‘chirildi'); await loadUsers(); userSheet(d.uid); } catch (err) { toast(err.message); }
    return;
  }
  if (d.att) return attendees(+d.att);
  if (d.edit) { const ev = S.dash.events.find((x) => x.id === +d.edit); let full = ev; try { const all = (await api('/api/events')).events; full = { ...ev, ...(all.find((x) => x.id === +d.edit) || {}) }; } catch (err) {} return eventForm(full); }
  if (d.dele) {
    if (!confirm('Tadbir o‘chirilsinmi? Ro‘yxatdagilar ham o‘chadi.')) return;
    try { await api('/api/events/' + d.dele, { method: 'DELETE' }); toast('Tadbir o‘chirildi'); await loadDash(); render(); } catch (err) { toast(err.message); }
    return;
  }
  if (d.annt) { try { const r = await api(`/api/events/${d.annt}/announce`, { method: 'POST', body: {} }); toast(r.ok ? 'Sinov e’loni sizga yuborildi' : 'Xato: ' + (r.error || '')); } catch (err) { toast(err.message); } return; }
  if (d.anna) {
    if (!confirm('E’lon botdagi HAMMAGA yuboriladi (har kimga bir marta). Davom etilsinmi?')) return;
    b.disabled = true; b.textContent = 'Yuborilmoqda…';
    try { const r = await api(`/api/events/${d.anna}/announce`, { method: 'POST', body: { to: 'all' } }); toast(`Yuborildi: ${r.sent} · xato: ${r.failed}`); haptic(); } catch (err) { toast(err.message); }
    await loadDash(); render(); return;
  }
  if (d.rmadmin) {
    if (!confirm('Bu odam jamoadan chiqarilsinmi?')) return;
    try { await api('/api/admins/' + encodeURIComponent(d.rmadmin), { method: 'DELETE' }); toast('Jamoadan chiqarildi'); await loadTeam(); render(); } catch (err) { toast(err.message); }
    return;
  }
  if (d.pos) {
    const a = S.admins.find((x) => x.id === d.pos);
    const pos = prompt('Mas’uliyat (bo‘sh qoldirsangiz olib tashlanadi):', (a && a.position) || ''); if (pos === null) return;
    try { await api(`/api/people/${encodeURIComponent(d.pos)}/position`, { method: 'POST', body: { position: pos } }); toast('Saqlandi'); await loadTeam(); render(); } catch (err) { toast(err.message); }
    return;
  }
  if (d.act === 'bctest') {
    if (!S.bc.text.trim()) return toast('Avval matn yozing');
    try { const r = await api('/api/admin/broadcast', { method: 'POST', body: { ...S.bc, to: 'me' } }); toast(r.ok ? 'Sinov xabari botda — tekshiring' : 'Xato: ' + r.error); } catch (err) { toast(err.message); }
  }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, fd = Object.fromEntries(new FormData(f));
  if (f.id === 'evform') {
    const body = { ...fd, starts_at: new Date(fd.starts_at).toISOString() };
    try {
      let id = f.dataset.id;
      if (!id) id = (await api('/api/events', { method: 'POST', body })).id;
      await api('/api/admin/events/' + id, { method: 'PATCH', body });
      closeSheet(); toast(f.dataset.id ? 'Saqlandi' : 'Tadbir qo‘shildi'); haptic(); await loadDash(); render();
    } catch (err) { toast(err.message); }
  }
  if (f.id === 'svform') {
    try { await api('/api/service', { method: 'POST', body: { user_id: f.dataset.uid, ...fd } }); toast('Xizmat daftariga yozildi'); haptic(); await loadUsers(); userSheet(f.dataset.uid); } catch (err) { toast(err.message); }
  }
  if (f.id === 'addadmin') {
    try { const r = await api('/api/admins', { method: 'POST', body: fd }); toast(r.name + ' jamoaga qo‘shildi'); haptic(); await loadTeam(); render(); } catch (err) { toast(err.message); }
  }
  if (f.id === 'bcform') {
    const n = S.segs ? S.segs.sizes[S.bc.segment] : '?';
    if (!S.bc.text.trim()) return toast('Avval matn yozing');
    if (!confirm(`Xabar ${n} kishiga yuboriladi. Ishonchingiz komilmi?`)) return;
    S.sending = true; render();
    let tot = { sent: 0, failed: 0 };
    try {
      for (let i = 0; i < 20; i++) {
        const r = await api('/api/admin/broadcast', { method: 'POST', body: { ...S.bc, to: 'all' } });
        tot.sent += r.sent; tot.failed += r.failed;
        const res = $('#bcres'); if (res) res.textContent = `Yuborildi: ${tot.sent} · xato: ${tot.failed}${r.remaining ? ` · qoldi: ${r.remaining}` : ''}`;
        if (!r.remaining) break;
        await new Promise((z) => setTimeout(z, 1500));
      }
      haptic(); toast(`Tayyor: ${tot.sent} ta yetkazildi${tot.failed ? `, ${tot.failed} ta botni to‘xtatgan` : ''}`);
    } catch (err) { toast(err.message); }
    S.sending = false; S.dash = null; render(); loadDash();
    const res = $('#bcres'); if (res) res.textContent = `Oxirgi natija: ${tot.sent} yetkazildi · ${tot.failed} xato`;
  }
  if (f.id === 'loginform') {
    adminKey = fd.key.trim();
    try { const r = await api('/api/admin/check'); if (!r.admin) throw new Error(); store.set('bk_admin', adminKey); boot(); }
    catch (err) { adminKey = ''; $('#lerr').textContent = 'Kalit noto‘g‘ri'; }
  }
});

// ---------- boot
async function boot() {
  let ok = false;
  if (TG_INIT || adminKey) { try { ok = (await api('/api/admin/check')).admin; } catch (e) {} }
  if (!ok) {
    if (adminKey) { store.del('bk_admin'); adminKey = ''; }
    $('#app').innerHTML = `<div class="login card"><img src="logo.jpg" alt=""><h1>Admin panel</h1>
      <p class="small muted">${TG_INIT ? 'Sizning Telegram akkauntingiz jamoada emas. Admin kaliti bilan kiring:' : 'Telegram ichida jamoa a’zosi sifatida avtomatik ochiladi. Brauzerda — admin kaliti bilan:'}</p>
      <form class="form" id="loginform"><input class="in" name="key" type="password" placeholder="Admin kaliti" autocomplete="current-password" required><button class="btn" style="height:44px">Kirish</button><div id="lerr" class="small" style="color:var(--red)" role="alert"></div></form></div>`;
    return;
  }
  render();
  await load(S.tab, true);
  render();
}
boot();
setInterval(() => { if (S.tab === 'home' && !document.hidden && !$('.scrim')) load('home', true); }, 60000);
})();
</script>
</body>
</html>
